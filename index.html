<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diário de Degustação</title>
<meta name="theme-color" content="#17110D">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: uma coluna para celular; cartões só para charutos e sessões; cabeçalho fixo com cronômetro durante a sessão. Escuro por padrão (uso ao entardecer e à noite). */
:root{
  --bg:#17110D; --surface:#221912; --surface2:#2E231A; --line:#3E2F23;
  --fg:#F2E8D8; --muted:#BBA98F; --faint:#93826B;
  --ember:#E58A42; --ember-ink:#1A120C; --sand:#DDB66B;
  --ok:#86B97F; --warn:#E3B84F; --bad:#E8735D;
  --f-display:'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
  --f-body:'IBM Plex Sans', 'Segoe UI', Roboto, system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F5EFE5; --surface:#FCF8F2; --surface2:#EDE3D3; --line:#DACDB8;
  --fg:#2A1E15; --muted:#6B5945; --faint:#7E6C57;
  --ember:#B4561A; --ember-ink:#FFF8F0; --sand:#8E6A1E;
  --ok:#3D7A37; --warn:#8A650C; --bad:#B03A27; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#F5EFE5; --surface:#FCF8F2; --surface2:#EDE3D3; --line:#DACDB8;
  --fg:#2A1E15; --muted:#6B5945; --faint:#7E6C57;
  --ember:#B4561A; --ember-ink:#FFF8F0; --sand:#8E6A1E;
  --ok:#3D7A37; --warn:#8A650C; --bad:#B03A27; color-scheme:light; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:16px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:calc(40px + env(safe-area-inset-bottom, 0px))}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg)}
img{max-width:100%}
.wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0}
h1{font-size:40px; font-weight:800; line-height:1; letter-spacing:-0.01em}
h2{font-size:24px; font-weight:800}
h3,.h3{font-family:var(--f-display); font-size:19px; font-weight:600; display:block}
p{margin:0}
.eyebrow{font-family:var(--f-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ember)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{outline:2px solid var(--ember); outline-offset:2px}

header.top{padding-top:28px; display:flex; flex-direction:column; gap:8px}
.mode{font-size:13px; color:var(--faint)}

.btn{min-height:44px; padding:10px 18px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface2); font-weight:600; text-decoration:none; color:var(--fg)}
.btn.primary{background:var(--ember); border-color:var(--ember); color:var(--ember-ink)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad); color:var(--bad); background:transparent}
.btn.small{min-height:36px; padding:6px 12px; font-size:14px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

.tabs{display:flex; gap:4px; padding:4px; background:var(--surface); border-radius:14px; border:1px solid var(--line)}
.tabs button{flex:1; min-height:42px; border:0; border-radius:10px; background:transparent; font-weight:600; color:var(--muted); font-size:15px; padding:0 4px}
.tabs button[aria-selected="true"]{background:var(--surface2); color:var(--fg)}

.stats{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px}
.stat{padding:14px; border-radius:14px; background:var(--surface); display:flex; flex-direction:column; gap:2px; min-width:0}
.stat b{font-family:var(--f-display); font-size:26px; font-weight:800; line-height:1.1; overflow-wrap:anywhere}
.stat span{font-size:13px; color:var(--muted)}

.list{display:flex; flex-direction:column; gap:12px}
.card{padding:16px 18px; border-radius:16px; background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; gap:10px; min-width:0}
.card.live{border-color:var(--ember)}
.card .head{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.card .meta{font-size:14px; color:var(--muted)}
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; background:var(--surface2); font-size:13px; color:var(--fg); white-space:nowrap}
.chip.st-cesta{color:var(--sand)} .chip.st-estoque{color:var(--ok)} .chip.st-hist{color:var(--muted)}
.meter{display:flex; gap:3px} .meter i{width:16px; height:7px; border-radius:2px; background:var(--line)} .meter i.on{background:var(--ember)}
.score{font-family:var(--f-display); font-weight:800; font-size:30px; line-height:1; color:var(--ember)}
.empty{padding:22px; border-radius:16px; border:1.5px dashed var(--line); color:var(--muted); display:flex; flex-direction:column; gap:10px}
.banner{padding:14px 16px; border-radius:14px; border:1.5px solid var(--warn); display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap}

/* sessão */
.sbar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); padding-block:12px 10px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px}
.tline{flex-basis:100%; display:flex; align-items:center; gap:10px}
.tline .btn{margin-left:auto}
.sbar .who{flex:1; min-width:0}
.sbar .who h2{font-size:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.timer{display:flex; align-items:center; gap:8px}
.timer .clock{font-family:var(--f-mono); font-size:22px; font-variant-numeric:tabular-nums}
.ring{width:36px; height:36px; flex-shrink:0}
.ring circle{fill:none; stroke-width:4}
.ring .track{stroke:var(--line)} .ring .prog{stroke:var(--ember); stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%}
.ritmo{font-size:12px; color:var(--faint)}
fieldset{border:0; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; min-width:0}
legend{font-weight:600; font-size:15px; padding:0; margin-bottom:10px}
.opts{display:flex; flex-wrap:wrap; gap:8px}
.opt{min-height:40px; padding:7px 13px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font-size:15px; display:inline-flex; align-items:center; gap:7px}
.opt[aria-pressed="true"]{background:var(--ember); border-color:var(--ember); color:var(--ember-ink); font-weight:600}
.dot{width:10px; height:10px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.fam{display:flex; flex-direction:column; gap:6px}
.fam .lbl{font-size:12px; font-family:var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.seg{display:flex; gap:6px}
.seg button{flex:1; min-height:44px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); font-family:var(--f-mono); font-size:16px}
.seg button[aria-pressed="true"]{background:var(--ember); border-color:var(--ember); color:var(--ember-ink)}
.scale{display:flex; justify-content:space-between; font-size:12px; color:var(--faint)}
textarea, input[type=text], select{width:100%; min-height:44px; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--fg); font:inherit}
textarea{min-height:84px; resize:vertical}
label.f{display:flex; flex-direction:column; gap:6px; font-size:14px; color:var(--muted)}
input[type=range]{width:100%; accent-color:var(--ember); min-height:44px}
.rating{display:flex; align-items:baseline; gap:6px}
.rating b{font-family:var(--f-display); font-size:44px; font-weight:800; color:var(--ember); line-height:1}
.panel{padding:16px 18px; border-radius:14px; background:var(--surface); display:flex; flex-direction:column; gap:18px}
.alert{padding:14px 16px; border-radius:12px; border:1.5px solid var(--warn); color:var(--fg); display:flex; flex-direction:column; gap:4px; font-size:15px}
.alert b{color:var(--warn)}
.hint{font-size:14px; color:var(--muted); padding:12px 14px; border-radius:12px; background:var(--surface2)}

/* fotos da anilha */
.band{display:block; width:100%; max-width:100%; aspect-ratio:16/10; object-fit:contain; background:var(--surface2); border-radius:12px; border:1px solid var(--line)}
.band.thumb{width:84px; aspect-ratio:4/3; object-fit:cover; flex-shrink:0; border-radius:10px}
.band.cmpimg{aspect-ratio:4/3; object-fit:cover}
.bandslot{display:flex; flex-direction:column; gap:10px}
.filebtn{position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:8px}
.filebtn input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; margin:0}
.filebtn:focus-within{outline:2px solid var(--ember); outline-offset:2px}
.withthumb{display:flex; gap:12px; min-width:0; align-items:flex-start}
.durrow{display:grid; grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto; gap:10px; align-items:end}
.durrow input{text-align:center; font-family:var(--f-mono); font-size:18px}
input[type=number]{width:100%; min-height:44px; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--fg)}

/* detalhe */
.profile{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px}
.third{padding:14px 12px; border-radius:14px; background:var(--surface); display:flex; flex-direction:column; gap:10px; min-width:0}
.bar{height:80px; display:flex; align-items:flex-end; border-bottom:1.5px solid var(--line)}
.bar i{display:block; width:100%; border-radius:6px 6px 0 0; background:var(--ember)}
.third .tags{display:flex; flex-wrap:wrap; gap:5px}
.third .tags .chip{font-size:12px; padding:2px 8px}
.facts{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.fact{padding:12px 14px; border-radius:12px; background:var(--surface); min-width:0}
.fact span{display:block; font-size:12px; color:var(--faint); font-family:var(--f-mono); letter-spacing:.08em; text-transform:uppercase}
.fact b{font-weight:600; overflow-wrap:anywhere}
.cmp{overflow-x:auto}
.cmp table{width:100%; border-collapse:collapse; font-size:14px; min-width:420px}
.cmp th, .cmp td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top}
.cmp th{color:var(--faint); font-weight:500; width:28%}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:15px}
.kv dt{color:var(--faint)} .kv dd{margin:0; font-weight:600}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:600; z-index:20; max-width:calc(100% - 32px)}
@media (max-width:420px){ h1{font-size:34px} .stat b{font-size:21px} .timer .clock{font-size:18px} .facts{grid-template-columns:1fr} .tabs button{font-size:14px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite">
  <header class="top">
    <div class="eyebrow">Charutos · paladar e sensações</div>
    <h1>Diário de Degustação</h1>
    <p class="mode">Carregando seus registros…</p>
  </header>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
var APP_ID='diario-degustacao', BACKUP_VERSION=1;
var FAMILIES=[
  {id:'doce',label:'Doce',color:'#E6C68C',notes:['Doce','Mel','Baunilha','Creme','Caramelo']},
  {id:'castanha',label:'Castanhas',color:'#C99A62',notes:['Castanha','Amêndoa','Amendoim']},
  {id:'madeira',label:'Madeira',color:'#A6713F',notes:['Cedro','Carvalho','Tostado']},
  {id:'terra',label:'Terra',color:'#7F6B4F',notes:['Terroso','Couro','Feno']},
  {id:'cacau',label:'Cacau e café',color:'#6A4330',notes:['Cacau','Café','Chocolate amargo']},
  {id:'especiaria',label:'Especiarias',color:'#CF6339',notes:['Pimenta','Canela','Cravo']},
  {id:'fruta',label:'Fruta e flor',color:'#B9A646',notes:['Frutas secas','Cítrico','Floral']}
];
var NOTE_COLOR={}; FAMILIES.forEach(function(f){f.notes.forEach(function(n){NOTE_COLOR[n]=f.color;});});
var MOMENTS=['Pós-almoço','Entardecer','Fim de noite'];
var DRINKS=['Café','Água de coco','Caipirinha','Whisky','Rum','Cachaça envelhecida','Água','Outra'];
var STATUS={cesta:['Na cesta','st-cesta'],estoque:['Em estoque','st-estoque'],historico:['Histórico','st-hist']};
var CAMERA_ICON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>';
var GALLERY_ICON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M20.5 16l-5-5-8 8.5"></path></svg>';

var state={cigars:[],sessions:[],view:'home',tab:'acervo',detailId:null,step:0,cmpA:'',cmpB:'',confirmDelete:false,addOpen:false,loaded:false,dbError:false};
var draft=null, saveTimer=null, tick=null, wakeLock=null, installPrompt=null;
var photoURL={}, busy={uploading:false,importing:false,persisted:null};

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){try{return crypto.randomUUID().replace(/-/g,'').slice(0,20);}catch(e){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}}
function clone(o){return JSON.parse(JSON.stringify(o));}
function toast(msg){var t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true;},2800);}
function fmtDate(iso){try{return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return '';}}
function fmtDateTime(iso){try{return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function fmtClock(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;function p(n){return (n<10?'0':'')+n;}return (h?h+':'+p(m):p(m))+':'+p(ss);}
function elapsed(s){if(!s||!s.timer)return 0;var t=s.timer;return (t.acc||0)+(t.running&&t.resumedAt?Date.now()-t.resumedAt:0);}
function cigarById(id){for(var i=0;i<state.cigars.length;i++)if(state.cigars[i].id===id)return state.cigars[i];return null;}
function sessionById(id){for(var i=0;i<state.sessions.length;i++)if(state.sessions[i].id===id)return state.sessions[i];return null;}
function done(){return state.sessions.filter(function(s){return s.status==='concluida';});}
function openSession(){for(var i=0;i<state.sessions.length;i++)if(state.sessions[i].status==='aberta')return state.sessions[i];return null;}
function meter(n){var h='<span class="meter" role="img" aria-label="Força '+(n||0)+' de 5">';for(var i=1;i<=5;i++)h+='<i class="'+(i<=n?'on':'')+'"></i>';return h+'</span>';}
function strengthLabel(n){return ['—','Suave','Suave-médio','Médio','Médio-encorpado','Encorpado'][n||0]||'—';}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function bandImg(id,cls,alt){var u=photoURL[id];if(!u)return '';return '<img class="band '+(cls||'')+'" src="'+u+'" alt="'+esc(alt||'Foto da anilha')+'">';}
function bandOfCigar(cid){for(var i=0;i<state.sessions.length;i++){var s=state.sessions[i];if(s.cigarId===cid&&s.bandId&&photoURL[s.bandId])return s.bandId;}var c=cigarById(cid);return (c&&c.bandId&&photoURL[c.bandId])?c.bandId:null;}

/* ---------- armazenamento local (IndexedDB) ---------- */
var idb=null;
function openDB(){return new Promise(function(res,rej){if(!window.indexedDB){rej(new Error('sem IndexedDB'));return;}var r=indexedDB.open(APP_ID,1);
  r.onupgradeneeded=function(){var d=r.result;['cigars','sessions','photos'].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});});};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.onblocked=function(){rej(new Error('bloqueado'));};});}
function tx(store,mode,fn){return new Promise(function(res,rej){if(!idb){res(undefined);return;}var t,out;try{t=idb.transaction(store,mode);}catch(e){rej(e);return;}var rq=fn(t.objectStore(store));if(rq)rq.onsuccess=function(){out=rq.result;};
  t.oncomplete=function(){res(out);};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error||new Error('abortado'));};});}
function getAll(n){return tx(n,'readonly',function(s){return s.getAll();}).then(function(r){return r||[];});}
function putRec(n,o){return tx(n,'readwrite',function(s){return s.put(o);});}
function delRec(n,id){return tx(n,'readwrite',function(s){return s.delete(id);});}
function saveErr(e){var q=e&&(e.name==='QuotaExceededError');toast(q?'Sem espaço no celular para salvar. Libere espaço ou remova fotos antigas.':'Não foi possível salvar. Tente de novo.');}

function sortAll(){state.cigars.sort(function(a,b){return (a.order||999)-(b.order||999)||String(a.name).localeCompare(b.name);});state.sessions.sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt));});}
function upsertState(col,obj){var arr=col==='cigars'?state.cigars:state.sessions;var i=arr.findIndex(function(x){return x.id===obj.id;});if(i>=0)arr[i]=clone(obj);else arr.push(clone(obj));sortAll();}
function put(col,obj){upsertState(col,obj);ls('diario-dirty',String(Date.now()));return putRec(col,clone(obj)).catch(saveErr);}
function removeSession(id){state.sessions=state.sessions.filter(function(x){return x.id!==id;});ls('diario-dirty',String(Date.now()));return delRec('sessions',id).catch(saveErr);}
function removePhoto(id){if(!id)return;if(photoURL[id]){try{URL.revokeObjectURL(photoURL[id]);}catch(e){}delete photoURL[id];}delRec('photos',id).catch(function(){});}
function addPhoto(blob){var id=uid();return putRec('photos',{id:id,blob:blob,type:blob.type||'image/jpeg',createdAt:new Date().toISOString()}).then(function(){photoURL[id]=URL.createObjectURL(blob);return id;});}

function loadAll(){return Promise.all([getAll('cigars'),getAll('sessions'),getAll('photos')]).then(function(r){
  state.cigars=r[0];state.sessions=r[1];
  Object.keys(photoURL).forEach(function(k){try{URL.revokeObjectURL(photoURL[k]);}catch(e){}});photoURL={};
  r[2].forEach(function(p){if(p.blob)photoURL[p.id]=URL.createObjectURL(p.blob);});
  sortAll();state.loaded=true;});}

function init(){
  render();
  openDB().then(function(d){idb=d;return loadAll();}).catch(function(){state.dbError=true;state.loaded=true;}).then(function(){render();});
  try{if(navigator.storage&&navigator.storage.persisted){navigator.storage.persisted().then(function(p){busy.persisted=p;if(!p&&navigator.storage.persist)return navigator.storage.persist().then(function(v){busy.persisted=v;});}).then(function(){if(state.tab==='backup'&&state.view==='home')render();}).catch(function(){});}}catch(e){}
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installPrompt=e;if(state.view==='home'&&state.tab==='backup')render();});
window.addEventListener('appinstalled',function(){installPrompt=null;toast('App instalado na tela inicial');});

/* ---------- backup ---------- */
function blobToDataURL(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsDataURL(b);});}
function buildBackup(){return getAll('photos').then(function(ps){return Promise.all(ps.map(function(p){return blobToDataURL(p.blob).then(function(d){return {id:p.id,createdAt:p.createdAt,dataUrl:d};});}));}).then(function(photos){
  return {app:APP_ID,version:BACKUP_VERSION,exportedAt:new Date().toISOString(),cigars:state.cigars,sessions:state.sessions,photos:photos};});}
function backupFile(){return buildBackup().then(function(b){var name='diario-degustacao-'+new Date().toISOString().slice(0,10)+'.json';var blob=new Blob([JSON.stringify(b)],{type:'application/json'});var file=null;try{file=new File([blob],name,{type:'application/json'});}catch(e){}return {blob:blob,file:file,name:name};});}
function markBackup(){ls('diario-last-backup',String(Date.now()));}
function exportDownload(){backupFile().then(function(f){var a=document.createElement('a');a.href=URL.createObjectURL(f.blob);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},4000);markBackup();render();toast('Backup salvo em Downloads');}).catch(function(){toast('Não foi possível gerar o backup.');});}
function exportShare(){backupFile().then(function(f){if(!(f.file&&navigator.canShare&&navigator.canShare({files:[f.file]}))){toast('Compartilhamento indisponível. Use "Salvar backup".');return;}
  return navigator.share({files:[f.file],title:'Backup do Diário de Degustação'}).then(function(){markBackup();render();toast('Backup compartilhado');});}).catch(function(e){if(e&&e.name==='AbortError')return;toast('Não foi possível compartilhar o backup.');});}
function dataURLToBlob(d){return fetch(d).then(function(r){return r.blob();});}
function importFile(file){
  if(!file)return;busy.importing=true;render();
  file.text().then(function(txt){var b=JSON.parse(txt);if(!b||b.app!==APP_ID)throw new Error('formato');
    var cs=Array.isArray(b.cigars)?b.cigars:[],ss=Array.isArray(b.sessions)?b.sessions:[],ps=Array.isArray(b.photos)?b.photos:[];
    var chain=Promise.resolve(),nP=0;
    cs.forEach(function(c){if(c&&c.id)chain=chain.then(function(){return putRec('cigars',c);});});
    ss.forEach(function(s){if(s&&s.id)chain=chain.then(function(){return putRec('sessions',s);});});
    ps.forEach(function(p){if(p&&p.id&&typeof p.dataUrl==='string'&&p.dataUrl.indexOf('data:image/')===0)chain=chain.then(function(){return dataURLToBlob(p.dataUrl).then(function(bl){nP++;return putRec('photos',{id:p.id,blob:bl,type:bl.type,createdAt:p.createdAt||new Date().toISOString()});});});});
    return chain.then(loadAll).then(function(){busy.importing=false;state.tab='acervo';render();toast('Importados: '+cs.length+' charutos, '+ss.length+' sessões, '+nP+' fotos');});
  }).catch(function(e){busy.importing=false;render();toast(e&&e.message==='formato'?'Este arquivo não é um backup do Diário de Degustação.':'Não foi possível ler o arquivo de backup.');});
}
function needsBackup(){var dirty=Number(ls('diario-dirty')||0),last=Number(ls('diario-last-backup')||0);return state.sessions.length>0&&dirty>last;}

/* ---------- telas ---------- */
function render(){
  var app=document.getElementById('app');
  if(state.view==='session'&&draft){app.innerHTML=viewSession();startTick();return;}
  stopTick();
  if(state.view==='detail'){app.innerHTML=viewDetail();return;}
  app.innerHTML=viewHome();
}
function viewHeader(){
  var mode=state.dbError?'Este navegador bloqueou o armazenamento. Os registros não serão salvos; abra pelo Chrome, fora da aba anônima.':state.loaded?'Registros salvos neste celular. Faça backup de vez em quando.':'Carregando seus registros…';
  return '<header class="top"><div class="eyebrow">Charutos · paladar e sensações</div><h1>Diário de Degustação</h1><p class="mode">'+esc(mode)+'</p></header>';
}
function viewHome(){
  var h=viewHeader();
  var live=openSession();
  if(live){h+='<div class="card live"><div class="head"><div><div class="eyebrow">Sessão em andamento</div><h3>'+esc(live.cigarName)+'</h3><div class="meta num">'+fmtClock(elapsed(live))+' · '+esc(live.moment||'momento não marcado')+'</div></div><button class="btn primary" data-act="resume" data-id="'+esc(live.id)+'">Retomar</button></div></div>';}
  if(needsBackup()&&state.tab!=='backup')h+='<div class="banner"><span>Há registros novos sem backup.</span><button class="btn small" data-act="tab" data-id="backup">Fazer backup</button></div>';
  var ds=done();
  if(ds.length){
    var rated=ds.filter(function(s){return typeof s.rating==='number';});
    var mean=rated.length?(rated.reduce(function(a,s){return a+s.rating;},0)/rated.length):null;
    var best=rated.slice().sort(function(a,b){return b.rating-a.rating;})[0];
    h+='<div class="stats"><div class="stat"><b class="num">'+ds.length+'</b><span>sessões</span></div><div class="stat"><b class="num">'+(mean==null?'—':mean.toFixed(1).replace('.',','))+'</b><span>nota média</span></div><div class="stat"><b>'+esc(best?best.cigarName.split(' (')[0]:'—')+'</b><span>favorito</span></div></div>';
  }
  h+='<div class="tabs" role="tablist">'+[['acervo','Acervo'],['historico','Histórico'],['comparar','Comparar'],['backup','Backup']].map(function(t){return '<button role="tab" aria-selected="'+(state.tab===t[0])+'" data-act="tab" data-id="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div>';
  if(state.tab==='acervo')h+=viewAcervo();
  else if(state.tab==='historico')h+=viewHistorico();
  else if(state.tab==='comparar')h+=viewComparar();
  else h+=viewBackup();
  return h;
}
function importButton(primary){return '<span class="btn filebtn'+(primary?' primary':'')+'">Importar backup<input type="file" id="import-file" accept=".json,application/json" aria-label="Importar arquivo de backup"></span>';}
function viewAcervo(){
  var h='<div class="list">';
  if(!state.loaded){h+='<div class="empty">Carregando o acervo…</div>';}
  else if(!state.cigars.length){h+='<div class="empty"><b>Seu acervo está vazio.</b><span>Se você tem um arquivo de backup ou de migração, importe-o para trazer charutos e sessões. Ou adicione o primeiro charuto manualmente.</span><div class="row">'+(busy.importing?'<span class="muted">Importando…</span>':importButton(true))+'</div></div>';}
  state.cigars.forEach(function(c){
    var ss=done().filter(function(s){return s.cigarId===c.id;});
    var last=ss[0], st=STATUS[c.status]||STATUS.historico, bid=bandOfCigar(c.id);
    h+='<div class="card"><div class="head"><div class="withthumb">'+(bid?bandImg(bid,'thumb','Anilha do '+c.name):'')+'<div style="min-width:0"><h3>'+esc(c.name)+'</h3><div class="meta">'+esc([c.origin,c.vitola].filter(Boolean).join(' · '))+'</div></div></div>'+(last&&typeof last.rating==='number'?'<div class="score num" aria-label="Última nota">'+String(last.rating).replace('.',',')+'</div>':'')+'</div>';
    h+='<div class="row"><span class="chip '+st[1]+'">'+st[0]+'</span>'+meter(c.strength)+'<span class="meta">'+esc(strengthLabel(c.strength))+'</span>'+(ss.length?'<span class="meta">· '+ss.length+(ss.length>1?' sessões':' sessão')+'</span>':'')+'</div>';
    if(c.expected)h+='<p class="meta">Esperado: '+esc(c.expected)+'</p>';
    if(c.pairing)h+='<p class="meta">Combina com: '+esc(c.pairing)+'</p>';
    h+='<div class="row"><button class="btn primary small" data-act="start" data-id="'+esc(c.id)+'">Iniciar sessão</button></div></div>';
  });
  h+='</div>';
  if(state.loaded&&!state.dbError){
    if(!state.addOpen)h+='<button class="btn ghost" data-act="addopen">Adicionar charuto ao acervo</button>';
    else h+='<form class="panel" id="addForm"><h3>Novo charuto</h3>'+
      '<label class="f" for="nc-name">Nome<input type="text" id="nc-name" required placeholder="ex.: Cohiba Siglo I"></label>'+
      '<label class="f" for="nc-origin">Origem<input type="text" id="nc-origin" placeholder="ex.: Cuba"></label>'+
      '<label class="f" for="nc-vitola">Bitola<input type="text" id="nc-vitola" placeholder="ex.: 102 x 40 mm"></label>'+
      '<label class="f" for="nc-strength">Força esperada<select id="nc-strength"><option value="1">Suave</option><option value="2" selected>Suave-médio</option><option value="3">Médio</option><option value="4">Médio-encorpado</option><option value="5">Encorpado</option></select></label>'+
      '<label class="f" for="nc-status">Situação<select id="nc-status"><option value="estoque">Em estoque</option><option value="cesta">Na cesta</option><option value="historico">Histórico</option></select></label>'+
      '<div class="row"><button class="btn primary" type="submit">Adicionar</button><button class="btn ghost" type="button" data-act="addclose">Cancelar</button></div></form>';
  }
  return h;
}
function sessionCard(s){
  return '<button class="card" style="text-align:left; width:100%" data-act="detail" data-id="'+esc(s.id)+'"><div class="head"><div class="withthumb">'+(s.bandId?bandImg(s.bandId,'thumb','Anilha do '+s.cigarName):'')+'<div style="min-width:0"><span class="h3">'+esc(s.cigarName)+'</span><div class="meta">'+esc(fmtDate(s.createdAt))+' · '+esc([s.moment,s.drink].filter(Boolean).join(' · '))+'</div></div></div>'+(typeof s.rating==='number'?'<div class="score num">'+String(s.rating).replace('.',',')+'</div>':'')+'</div><div class="row">'+(s.rebuy?'<span class="chip">Recompraria: '+esc(s.rebuy)+'</span>':'')+(s.durationMin?'<span class="meta num">'+s.durationMin+' min</span>':'')+'</div></button>';
}
function viewHistorico(){
  var ds=done();
  if(!ds.length)return '<div class="empty"><b>Nenhuma sessão registrada ainda.</b><span>No Acervo, toque em “Iniciar sessão” quando acender o charuto. O cronômetro corre enquanto você anota cada terço.</span></div>';
  return '<div class="list">'+ds.map(sessionCard).join('')+'</div>';
}
function cmpRow(label,a,b){return '<tr><th scope="row">'+label+'</th><td>'+a+'</td><td>'+b+'</td></tr>';}
function viewComparar(){
  var ds=done();
  if(ds.length<2)return '<div class="empty"><b>Compare duas sessões lado a lado.</b><span>Registre pelo menos duas sessões. Sugestão: Montecristo #4 e Cohiba Siglo II, mesma bitola, em noites diferentes e com a mesma bebida.</span></div>';
  if(!sessionById(state.cmpA))state.cmpA=ds[0].id;
  if(!sessionById(state.cmpB)||state.cmpB===state.cmpA)state.cmpB=(ds[1]||ds[0]).id;
  function opts(sel){return ds.map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===sel?' selected':'')+'>'+esc(s.cigarName+' · '+fmtDate(s.createdAt))+'</option>';}).join('');}
  var A=sessionById(state.cmpA),B=sessionById(state.cmpB);
  function tags(s,i){var t=(s.thirds&&s.thirds[i])||{};return esc((t.notes||[]).join(', ')||'—')+(t.intensity?' <span class="faint num">('+t.intensity+'/5)</span>':'');}
  function band(s){return s.bandId&&photoURL[s.bandId]?bandImg(s.bandId,'cmpimg','Anilha do '+s.cigarName):'<span class="faint">sem foto</span>';}
  var h='<div class="panel"><label class="f" for="cmpA">Sessão A<select id="cmpA" data-cmp="A">'+opts(state.cmpA)+'</select></label><label class="f" for="cmpB">Sessão B<select id="cmpB" data-cmp="B">'+opts(state.cmpB)+'</select></label></div>';
  h+='<div class="cmp"><table><thead><tr><th></th><th>'+esc(A.cigarName)+'</th><th>'+esc(B.cigarName)+'</th></tr></thead><tbody>'+
    ((A.bandId||B.bandId)?cmpRow('Anilha',band(A),band(B)):'')+
    cmpRow('Data',esc(fmtDate(A.createdAt)),esc(fmtDate(B.createdAt)))+
    cmpRow('Momento',esc(A.moment||'—'),esc(B.moment||'—'))+
    cmpRow('Bebida',esc(A.drink||'—'),esc(B.drink||'—'))+
    cmpRow('1º terço',tags(A,0),tags(B,0))+cmpRow('2º terço',tags(A,1),tags(B,1))+cmpRow('3º terço',tags(A,2),tags(B,2))+
    cmpRow('Força percebida',meter(A.strength),meter(B.strength))+
    cmpRow('Queima',esc(A.burn||'—'),esc(B.burn||'—'))+cmpRow('Tiragem',esc(A.draw||'—'),esc(B.draw||'—'))+
    cmpRow('Como ficou',esc(A.feel||'—'),esc(B.feel||'—'))+
    cmpRow('Duração',A.durationMin?A.durationMin+' min':'—',B.durationMin?B.durationMin+' min':'—')+
    cmpRow('Nota',typeof A.rating==='number'?'<b class="num">'+String(A.rating).replace('.',',')+'</b>':'—',typeof B.rating==='number'?'<b class="num">'+String(B.rating).replace('.',',')+'</b>':'—')+
    cmpRow('Recompraria',esc(A.rebuy||'—'),esc(B.rebuy||'—'))+
    '</tbody></table></div>';
  return h;
}
function viewBackup(){
  var last=Number(ls('diario-last-backup')||0);
  var canShare=false;try{canShare=!!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.json',{type:'application/json'})]}));}catch(e){}
  var h='<div class="panel"><h2>Backup</h2><p class="muted">Os registros e as fotos ficam só neste celular. Se você limpar os dados do navegador, trocar de aparelho ou desinstalar o app, só o backup recupera tudo.</p>'+
    '<dl class="kv"><dt>Charutos</dt><dd class="num">'+state.cigars.length+'</dd><dt>Sessões</dt><dd class="num">'+state.sessions.length+'</dd><dt>Fotos</dt><dd class="num">'+Object.keys(photoURL).length+'</dd><dt>Último backup</dt><dd>'+(last?esc(fmtDateTime(new Date(last).toISOString())):'nunca')+'</dd><dt>Proteção contra limpeza</dt><dd>'+(busy.persisted===true?'ativa':busy.persisted===false?'não concedida pelo navegador':'verificando…')+'</dd></dl>'+
    '<div class="row"><button class="btn primary" data-act="export">Salvar backup</button>'+(canShare?'<button class="btn" data-act="share">Enviar backup (Drive, WhatsApp…)</button>':'')+'</div>'+
    '<p class="hint">Dica: envie o backup para o seu Google Drive ou e-mail. Você também pode mandar esse arquivo para o Claude analisar suas degustações e sugerir a próxima compra.</p></div>';
  h+='<div class="panel"><h3>Restaurar ou migrar</h3><p class="muted">Importar um backup soma os registros aos atuais. Registros com o mesmo identificador são substituídos pela versão do arquivo.</p><div class="row">'+(busy.importing?'<span class="muted">Importando…</span>':importButton(false))+'</div></div>';
  if(installPrompt)h+='<div class="panel"><h3>Instalar na tela inicial</h3><p class="muted">Cria um ícone que abre o diário como app, em tela cheia e funcionando sem internet.</p><div class="row"><button class="btn primary" data-act="install">Instalar app</button></div></div>';
  return h;
}

function optBtns(field,list,val){return '<div class="opts">'+list.map(function(o){return '<button type="button" class="opt" aria-pressed="'+(val===o)+'" data-act="set" data-field="'+field+'" data-val="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+'</div>';}
function segBtns(field,max,val,lo,hi){var h='<div class="seg">';for(var i=1;i<=max;i++)h+='<button type="button" aria-pressed="'+(val===i)+'" data-act="setnum" data-field="'+field+'" data-val="'+i+'">'+i+'</button>';return h+'</div><div class="scale"><span>'+lo+'</span><span>'+hi+'</span></div>';}
function bandSlot(s){
  var h='<fieldset class="bandslot"><legend>Anilha</legend>';
  if(s.bandId&&photoURL[s.bandId])h+=bandImg(s.bandId,'','Anilha do '+s.cigarName);
  if(busy.uploading)h+='<p class="muted">Salvando foto…</p>';
  else{
    var has=s.bandId&&photoURL[s.bandId];
    h+='<div class="row"><span class="btn filebtn'+(has?'':' primary')+'">'+CAMERA_ICON+(has?'Nova foto':'Câmera')+'<input type="file" id="band-camera" accept="image/*" capture="environment" aria-label="Fotografar a anilha com a câmera"></span>'+
       '<span class="btn filebtn">'+GALLERY_ICON+'Galeria<input type="file" id="band-gallery" accept="image/*" aria-label="Escolher foto da anilha na galeria"></span>'+
       (has?'<button type="button" class="btn ghost" data-act="rmband">Remover</button>':'')+'</div>';
    if(!has)h+='<p class="hint">Fotografe a anilha antes de acender, ou quando retirá-la depois do 1º terço: com o charuto aquecido, a cola solta e a capa não rasga.</p>';
  }
  return h+'</fieldset>';
}
function durMin(s){return Math.max(0,Math.round(elapsed(s)/60000));}
function fmtDur(min){var h=Math.floor(min/60),m=min%60;return h?(h+' h'+(m?' '+m+' min':'')):(m+' min');}
function setDuration(min){min=Math.max(1,Math.min(600,Math.round(min||0)));draft.timer={acc:min*60000,running:false,resumedAt:null};draft.durationMin=min;var c=document.getElementById('clock');if(c)c.textContent=fmtDur(min);return min;}
function viewSession(){
  var s=draft, run=s.timer&&s.timer.running, editing=s.status==='concluida';
  var steps=['1º terço','2º terço','3º terço','Fechamento'];
  var h='<div class="sbar"><button class="btn small ghost" data-act="home" aria-label="Voltar ao início">Início</button><div class="who"><h2>'+esc(s.cigarName)+'</h2></div>';
  if(editing)h+='<div class="tline"><span class="eyebrow">Editando registro</span><span class="clock num" id="clock" style="margin-left:auto">'+fmtDur(durMin(s))+'</span></div></div>';
  else h+='<div class="tline"><div class="timer"><svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="track" cx="20" cy="20" r="16"></circle><circle class="prog" id="ring" cx="20" cy="20" r="16" stroke-dasharray="100.53" stroke-dashoffset="100.53"></circle></svg><span class="clock" id="clock">'+fmtClock(elapsed(s))+'</span></div><span class="ritmo">1 baforada por minuto</span>'+
    '<button class="btn small" data-act="toggle">'+(run?'Pausar':'Retomar')+'</button></div></div>';
  if(editing){var dm=durMin(s),hh=Math.floor(dm/60),mm=dm%60;
    h+='<div class="panel"><fieldset><legend>Duração da sessão</legend><div class="durrow">'+
      '<button type="button" class="btn" data-act="dur" data-val="-5" aria-label="Diminuir 5 minutos">−5</button>'+
      '<label class="f" for="dur-h">Horas<input type="number" id="dur-h" min="0" max="10" inputmode="numeric" value="'+hh+'" data-input="dur"></label>'+
      '<label class="f" for="dur-m">Minutos<input type="number" id="dur-m" min="0" max="59" inputmode="numeric" value="'+mm+'" data-input="dur"></label>'+
      '<button type="button" class="btn" data-act="dur" data-val="5" aria-label="Aumentar 5 minutos">+5</button></div>'+
      '<p class="faint" style="font-size:13px">Corrija aqui se o cronômetro ficou ligado ou foi pausado sem querer. Mínimo de 1 minuto.</p></fieldset></div>';}
  h+='<div class="panel"><fieldset><legend>Momento</legend>'+optBtns('moment',MOMENTS,s.moment)+'</fieldset><fieldset><legend>Bebida</legend>'+optBtns('drink',DRINKS,s.drink)+'</fieldset>'+bandSlot(s)+'</div>';
  h+='<div class="tabs" role="tablist">'+steps.map(function(t,i){return '<button role="tab" aria-selected="'+(state.step===i)+'" data-act="step" data-id="'+i+'">'+t+'</button>';}).join('')+'</div>';
  if(state.step<3){
    var t=s.thirds[state.step];
    h+='<div class="panel"><fieldset><legend>O que você sente no '+steps[state.step]+'?</legend>';
    FAMILIES.forEach(function(f){h+='<div class="fam"><span class="lbl">'+f.label+'</span><div class="opts">'+f.notes.map(function(n){var on=t.notes.indexOf(n)>=0;return '<button type="button" class="opt" aria-pressed="'+on+'" data-act="note" data-val="'+esc(n)+'"><span class="dot" style="background:'+f.color+'"></span>'+esc(n)+'</button>';}).join('')+'</div></div>';});
    h+='</fieldset><fieldset><legend>Intensidade do sabor</legend>'+segBtns('intensity',5,t.intensity,'delicado','intenso')+'</fieldset>';
    h+='<label class="f" for="t-text">Anotações deste terço<textarea id="t-text" data-input="thirdText" placeholder="ex.: começou com feno e mel, retrogosto com pimenta branca">'+esc(t.text)+'</textarea></label>';
    h+='<div class="row"><button class="btn primary" data-act="step" data-id="'+(state.step+1)+'">'+(state.step<2?'Ir para o '+steps[state.step+1]:'Ir para o fechamento')+'</button></div></div>';
    if(state.step===2)h+='<p class="hint">No último terço o charuto esquenta e fica mais intenso. Vá devagar e pare quando ficar áspero.</p>';
  }else{
    h+='<div class="panel"><fieldset><legend>Força percebida (nicotina)</legend>'+segBtns('strength',5,s.strength,'suave','encorpado')+'</fieldset>'+
      '<fieldset><legend>Queima</legend>'+optBtns('burn',['Uniforme','Torta','Tunelou'],s.burn)+'</fieldset>'+
      '<fieldset><legend>Tiragem</legend>'+optBtns('draw',['Solta','Ideal','Presa'],s.draw)+'</fieldset>'+
      '<fieldset><legend>Como você está?</legend>'+optBtns('feel',['Bem','Leve tontura','Mal-estar'],s.feel)+'</fieldset>';
    if(s.feel&&s.feel!=='Bem')h+='<div class="alert" role="alert"><b>Pause o charuto agora.</b><span>Coma ou beba algo doce, sente-se em local fresco e beba água. Se não melhorar, ou se houver dor no peito, falta de ar ou desmaio, procure atendimento médico.</span></div>';
    h+='<fieldset><legend>Nota geral</legend><div class="rating"><b class="num" id="ratingOut">'+(typeof s.rating==='number'?String(s.rating).replace('.',','):'—')+'</b><span class="muted">de 10</span></div><input type="range" id="rating" min="0" max="10" step="0.5" value="'+(typeof s.rating==='number'?s.rating:7)+'" data-input="rating" aria-label="Nota geral de 0 a 10"></fieldset>'+
      '<fieldset><legend>Recompraria?</legend>'+optBtns('rebuy',['Sim','Talvez','Não'],s.rebuy)+'</fieldset>'+
      '<label class="f" for="s-comment">Impressão final<textarea id="s-comment" data-input="comment" placeholder="ex.: cremoso do início ao fim; casou muito bem com o bourbon">'+esc(s.comment)+'</textarea></label>'+
      (s.status==='concluida'?'<div class="row"><button class="btn primary" data-act="finish">Salvar alterações</button></div></div>':'<div class="row"><button class="btn primary" data-act="finish">Encerrar e salvar sessão</button><button class="btn ghost" data-act="home">Salvar e continuar depois</button></div></div>');
  }
  return h;
}
function viewDetail(){
  var s=sessionById(state.detailId);
  if(!s){state.view='home';return viewHome();}
  var h='<header class="top"><button class="btn small ghost" style="align-self:flex-start" data-act="home">Voltar</button><div class="eyebrow">'+esc(fmtDate(s.createdAt))+'</div><h1 style="font-size:34px">'+esc(s.cigarName)+'</h1><p class="muted">'+esc([s.moment,s.drink,s.durationMin?s.durationMin+' min':''].filter(Boolean).join(' · '))+'</p></header>';
  if(s.bandId&&photoURL[s.bandId])h+=bandImg(s.bandId,'','Anilha do '+s.cigarName);
  h+='<div class="row" style="justify-content:space-between"><div class="rating"><b class="num">'+(typeof s.rating==='number'?String(s.rating).replace('.',','):'—')+'</b><span class="muted">de 10</span></div>'+(s.rebuy?'<span class="chip">Recompraria: '+esc(s.rebuy)+'</span>':'')+'</div>';
  h+='<div><h2 style="margin-bottom:12px">Evolução por terço</h2><div class="profile">';
  for(var i=0;i<3;i++){var t=(s.thirds&&s.thirds[i])||{notes:[],intensity:0,text:''};
    h+='<div class="third"><div class="bar" role="img" aria-label="Intensidade '+(t.intensity||0)+' de 5"><i style="height:'+((t.intensity||0)/5*100)+'%"></i></div><b>'+(i+1)+'º terço</b><div class="tags">'+((t.notes||[]).map(function(n){return '<span class="chip"><span class="dot" style="background:'+(NOTE_COLOR[n]||'#999')+'"></span>'+esc(n)+'</span>';}).join('')||'<span class="faint">sem notas</span>')+'</div>'+(t.text?'<p class="meta" style="font-size:14px">'+esc(t.text)+'</p>':'')+'</div>';}
  h+='</div></div>';
  h+='<div class="facts"><div class="fact"><span>Força percebida</span>'+meter(s.strength)+' <b>'+esc(strengthLabel(s.strength))+'</b></div><div class="fact"><span>Como ficou</span><b>'+esc(s.feel||'—')+'</b></div><div class="fact"><span>Queima</span><b>'+esc(s.burn||'—')+'</b></div><div class="fact"><span>Tiragem</span><b>'+esc(s.draw||'—')+'</b></div></div>';
  if(s.comment)h+='<div class="panel"><span class="eyebrow">Impressão final</span><p>'+esc(s.comment)+'</p></div>';
  if(!state.confirmDelete)h+='<div class="row"><button class="btn" data-act="edit" data-id="'+esc(s.id)+'">Editar registro</button><button class="btn danger" data-act="askdel">Apagar</button></div>';
  else h+='<div class="alert"><b>Apagar esta sessão?</b><span>O registro e a foto saem do diário e não podem ser recuperados, a menos que estejam num backup.</span><div class="row" style="margin-top:8px"><button class="btn danger" data-act="del" data-id="'+esc(s.id)+'">Apagar sessão</button><button class="btn ghost" data-act="canceldel">Manter</button></div></div>';
  return h;
}

/* ---------- ciclo da sessão ---------- */
function newSession(c){
  return {id:uid(),cigarId:c.id,cigarName:c.name,status:'aberta',createdAt:new Date().toISOString(),moment:'',drink:'',
    thirds:[{notes:[],intensity:0,text:''},{notes:[],intensity:0,text:''},{notes:[],intensity:0,text:''}],
    strength:0,burn:'',draw:'',feel:'',rating:null,rebuy:'',comment:'',timer:{acc:0,running:true,resumedAt:Date.now()},durationMin:0};
}
function enterSession(s){draft=clone(s);if(!draft.thirds)draft.thirds=newSession({}).thirds;state.view='session';state.step=0;render();window.scrollTo(0,0);requestWake();}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);}
function flush(){clearTimeout(saveTimer);if(!draft)return Promise.resolve();return put('sessions',draft);}
function leaveSession(){flush();draft=null;releaseWake();state.view='home';state.tab='acervo';render();window.scrollTo(0,0);}
function startTick(){stopTick();tick=setInterval(updateClock,1000);updateClock();}
function stopTick(){if(tick){clearInterval(tick);tick=null;}}
function updateClock(){if(!draft||draft.status==='concluida')return;var ms=elapsed(draft),c=document.getElementById('clock'),r=document.getElementById('ring');if(c)c.textContent=fmtClock(ms);if(r)r.setAttribute('stroke-dashoffset',String(100.53*(1-((ms/1000)%60)/60)));}
function requestWake(){try{if(navigator.wakeLock&&navigator.wakeLock.request){navigator.wakeLock.request('screen').then(function(l){wakeLock=l;}).catch(function(){});}}catch(e){}}
function releaseWake(){try{if(wakeLock)wakeLock.release();}catch(e){}wakeLock=null;}
function compress(file){return new Promise(function(res){var url;try{url=URL.createObjectURL(file);}catch(e){res(file);return;}var img=new Image();
  img.onload=function(){try{var max=1400,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(function(b){res(b||file);},'image/jpeg',0.85);}catch(e){URL.revokeObjectURL(url);res(file);}};
  img.onerror=function(){URL.revokeObjectURL(url);res(null);};img.src=url;});}
function handleBandFile(file){
  if(!file||!draft)return;
  busy.uploading=true;render();
  var sid=draft.id, old=draft.bandId;
  compress(file).then(function(b){if(!b)throw new Error('decode');return addPhoto(b);}).then(function(id){
    busy.uploading=false;
    if(draft&&draft.id===sid){draft.bandId=id;flush();render();}
    if(old&&old!==id)removePhoto(old);
    toast('Foto da anilha salva');
  }).catch(function(e){busy.uploading=false;render();toast(e&&e.message==='decode'?'Não foi possível abrir essa imagem. Tente outra foto.':'Não foi possível salvar a foto. Verifique o espaço do celular.');});
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id'),val=b.getAttribute('data-val'),field=b.getAttribute('data-field');
  switch(act){
    case 'tab': state.tab=id; state.view='home'; render(); break;
    case 'start': {var c=cigarById(id);if(!c)return;if(openSession()){toast('Termine ou retome a sessão em andamento primeiro.');return;}var s=newSession(c);put('sessions',s);enterSession(s);break;}
    case 'resume': case 'edit': {var s2=sessionById(id);if(s2){state.confirmDelete=false;enterSession(s2);}break;}
    case 'home': if(state.view==='session')leaveSession();else{state.view='home';state.confirmDelete=false;render();window.scrollTo(0,0);} break;
    case 'toggle': {var t=draft.timer;if(t.running){t.acc=(t.acc||0)+(Date.now()-t.resumedAt);t.running=false;t.resumedAt=null;}else{t.running=true;t.resumedAt=Date.now();}flush();render();break;}
    case 'step': state.step=Number(id); render(); window.scrollTo(0,0); break;
    case 'set': draft[field]=draft[field]===val?'':val; scheduleSave(); render(); break;
    case 'setnum': {var n=Number(val);if(field==='intensity'){var th=draft.thirds[state.step];th.intensity=th.intensity===n?0:n;}else draft[field]=draft[field]===n?0:n;scheduleSave();render();break;}
    case 'note': {var tt=draft.thirds[state.step],i=tt.notes.indexOf(val);if(i>=0)tt.notes.splice(i,1);else tt.notes.push(val);scheduleSave();render();break;}
    case 'dur': {var nm=setDuration(durMin(draft)+Number(val));var ih=document.getElementById('dur-h'),im=document.getElementById('dur-m');if(ih)ih.value=Math.floor(nm/60);if(im)im.value=nm%60;scheduleSave();break;}
    case 'rmband': {var ob=draft.bandId;draft.bandId=null;flush();removePhoto(ob);render();toast('Foto removida');break;}
    case 'finish': {var tm=draft.timer;if(tm.running){tm.acc=(tm.acc||0)+(Date.now()-tm.resumedAt);tm.running=false;tm.resumedAt=null;}
      var wasDone=draft.status==='concluida';
      draft.status='concluida';if(!wasDone||!draft.endedAt)draft.endedAt=new Date().toISOString();draft.durationMin=Math.max(1,Math.round((tm.acc||0)/60000));
      if(typeof draft.rating!=='number'){var r=document.getElementById('rating');draft.rating=r?Number(r.value):null;}
      var sid=draft.id;flush().then(function(){toast(wasDone?'Alterações salvas':'Sessão salva no diário');});draft=null;releaseWake();state.view='detail';state.detailId=sid;render();window.scrollTo(0,0);break;}
    case 'detail': state.view='detail'; state.detailId=id; state.confirmDelete=false; render(); window.scrollTo(0,0); break;
    case 'askdel': state.confirmDelete=true; render(); break;
    case 'canceldel': state.confirmDelete=false; render(); break;
    case 'del': {var d0=sessionById(id);if(d0&&d0.bandId)removePhoto(d0.bandId);removeSession(id).then(function(){toast('Sessão apagada');});state.confirmDelete=false;state.view='home';state.tab='historico';render();break;}
    case 'addopen': state.addOpen=true; render(); var f=document.getElementById('nc-name'); if(f)f.focus(); break;
    case 'addclose': state.addOpen=false; render(); break;
    case 'export': exportDownload(); break;
    case 'share': exportShare(); break;
    case 'install': if(installPrompt){installPrompt.prompt();installPrompt.userChoice.then(function(){installPrompt=null;render();}).catch(function(){});} break;
  }
});
document.addEventListener('input',function(ev){
  var el=ev.target, k=el.getAttribute('data-input'); if(!k||!draft)return;
  if(k==='thirdText')draft.thirds[state.step].text=el.value;
  else if(k==='comment')draft.comment=el.value;
  else if(k==='dur'){var hv=parseInt(document.getElementById('dur-h').value,10)||0,mv=parseInt(document.getElementById('dur-m').value,10)||0;if(hv*60+mv<1)return;setDuration(hv*60+mv);}
  else if(k==='rating'){draft.rating=Number(el.value);var o=document.getElementById('ratingOut');if(o)o.textContent=String(draft.rating).replace('.',',');}
  scheduleSave();
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='band-camera'||el.id==='band-gallery'){var f=el.files&&el.files[0];el.value='';handleBandFile(f);return;}
  if(el.id==='import-file'){var g=el.files&&el.files[0];el.value='';importFile(g);return;}
  var w=el.getAttribute('data-cmp');if(!w)return;if(w==='A')state.cmpA=el.value;else state.cmpB=el.value;render();
});
document.addEventListener('submit',function(ev){
  if(ev.target.id!=='addForm')return; ev.preventDefault();
  var name=document.getElementById('nc-name').value.trim(); if(!name){toast('Informe o nome do charuto.');return;}
  var c={id:uid(),name:name,origin:document.getElementById('nc-origin').value.trim(),vitola:document.getElementById('nc-vitola').value.trim(),strength:Number(document.getElementById('nc-strength').value),status:document.getElementById('nc-status').value,order:100+state.cigars.length};
  put('cigars',c); state.addOpen=false; render(); toast('Charuto adicionado ao acervo');
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush();else if(state.view==='session'&&draft)requestWake();});

init();
})();
</script>
