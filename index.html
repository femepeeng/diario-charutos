<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diário de Degustação</title>
<meta name="theme-color" content="#17110D">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: uma coluna para celular; cartões para charutos, sessões e posts do clube; cabeçalho fixo com cronômetro durante a sessão. Escuro por padrão (uso ao entardecer e à noite). */
:root{
  --bg:#17110D; --surface:#221912; --surface2:#2E231A; --line:#3E2F23;
  --fg:#F2E8D8; --muted:#BBA98F; --faint:#93826B;
  --ember:#E58A42; --ember-ink:#1A120C; --sand:#DDB66B;
  --ok:#86B97F; --warn:#E3B84F; --bad:#E8735D;
  --f-display:'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
  --f-body:'IBM Plex Sans', 'Segoe UI', Roboto, system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F5EFE5; --surface:#FCF8F2; --surface2:#EDE3D3; --line:#DACDB8;
  --fg:#2A1E15; --muted:#6B5945; --faint:#7E6C57;
  --ember:#B4561A; --ember-ink:#FFF8F0; --sand:#8E6A1E;
  --ok:#3D7A37; --warn:#8A650C; --bad:#B03A27; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#F5EFE5; --surface:#FCF8F2; --surface2:#EDE3D3; --line:#DACDB8;
  --fg:#2A1E15; --muted:#6B5945; --faint:#7E6C57;
  --ember:#B4561A; --ember-ink:#FFF8F0; --sand:#8E6A1E;
  --ok:#3D7A37; --warn:#8A650C; --bad:#B03A27; color-scheme:light; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:16px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:calc(40px + env(safe-area-inset-bottom, 0px))}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg)}
img{max-width:100%}
.wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0}
h1{font-size:40px; font-weight:800; line-height:1; letter-spacing:-0.01em}
h2{font-size:24px; font-weight:800}
h3,.h3{font-family:var(--f-display); font-size:19px; font-weight:600; display:block}
p{margin:0}
.eyebrow{font-family:var(--f-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ember)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{opacity:.55; cursor:default}
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{outline:2px solid var(--ember); outline-offset:2px}

header.top{padding-top:28px; display:flex; flex-direction:column; gap:8px}
.mode{font-size:13px; color:var(--faint); display:flex; gap:8px; align-items:center}
.mode .sdot{flex:none}
.toprow{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.toptitle{display:flex; flex-direction:column; gap:8px; min-width:0}
.crown{flex:none; width:48px; height:48px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface2); color:var(--ember); display:inline-flex; align-items:center; justify-content:center; position:relative}
.crown[aria-current="page"]{border-color:var(--ember)}
.crown .cdot{position:absolute; top:7px; right:7px; width:8px; height:8px; border-radius:50%; background:var(--ember); border:2px solid var(--surface2)}
.sdot{width:8px; height:8px; border-radius:50%; background:var(--faint); flex-shrink:0}
.sdot.ok{background:var(--ok)} .sdot.warn{background:var(--warn)} .sdot.bad{background:var(--bad)}

.btn{min-height:44px; padding:10px 18px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface2); font-weight:600; text-decoration:none; color:var(--fg); display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn.primary{background:var(--ember); border-color:var(--ember); color:var(--ember-ink)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad); color:var(--bad); background:transparent}
.btn.small{min-height:36px; padding:6px 12px; font-size:14px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.linkbtn{background:none; border:0; padding:0; color:var(--ember); font-weight:600; text-decoration:underline; text-underline-offset:3px}

.tabs{display:flex; gap:4px; padding:4px; background:var(--surface); border-radius:14px; border:1px solid var(--line); overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto; min-height:44px; border:0; border-radius:10px; background:transparent; font-weight:600; color:var(--muted); font-size:15px; padding:0 10px}
.tabs button[aria-selected="true"]{background:var(--surface2); color:var(--fg)}
.ginicio{display:flex; flex-direction:column; gap:12px; min-width:0}
.thread{display:flex; flex-direction:column; gap:8px}
.msg{max-width:88%; padding:10px 12px; border-radius:14px; background:var(--surface2); display:flex; flex-direction:column; gap:4px; min-width:0}
.msg.mine{align-self:flex-end; border:1.5px solid var(--ember)}
.msg.theirs{align-self:flex-start}
.msg p,.aviso-item p{margin:0; white-space:pre-wrap; overflow-wrap:anywhere}
.mhead{font-size:12px; color:var(--muted)}
.aviso-item{padding:10px 0; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px}
.aviso .abody{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1 1 200px}
.aviso .abody span{overflow-wrap:anywhere}
.tdot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ember); margin-left:6px; vertical-align:middle}
.admsecs .opt{min-height:44px}
.inbox-row{display:flex; align-items:center; gap:10px; width:100%; min-height:52px; padding:10px 14px; border-radius:14px; border:1px solid var(--line); background:var(--surface); color:var(--fg); text-align:left; font:inherit}
.inbox-row .ib-name{flex:1; font-weight:600; min-width:0; overflow-wrap:anywhere}
.chip.unread{background:var(--ember); color:var(--ember-ink); font-weight:700}
.inv-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid var(--line)}
.inv-row b{overflow-wrap:anywhere}
.catwhy{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:4px; font-size:14px; color:var(--muted)}
.catwhy li.warn{color:var(--warn)}
.catseg .opt{min-height:44px}
.cestaopts{display:flex; flex-direction:column; gap:6px}
.cestasize{gap:4px}
.cestasize .opt{flex:1 1 0; min-height:44px; min-width:44px; padding-left:0; padding-right:0; justify-content:center}
.cestac .head .chip{flex:none}
details.ped{border:1.5px solid var(--line); border-radius:12px; padding:4px 12px}
details.ped summary{cursor:pointer; font-weight:600; min-height:44px; padding:11px 0; box-sizing:border-box}
details.ped .pedbody{display:flex; flex-direction:column; gap:12px; padding:4px 0 12px}
.pedlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.pedlist li{display:flex; align-items:center; justify-content:space-between; gap:10px}
.pedlist .opt{min-height:44px; flex:none}
.pedlist .faint{white-space:nowrap}
.catcount{font-size:13px; margin:0 0 8px}
.cmpsim .list{gap:10px}
.gwelcome{gap:10px; border:1.5px solid var(--line)}
.gwelcome h3,.gwelcome p{margin:0}
.gwelcome .row>*{flex:1 1 auto}
.ghead{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.gcount{font-size:12px; font-family:var(--f-mono)}
.gcar{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; margin:0 -16px; padding:2px 16px 6px; scroll-padding-left:16px; overscroll-behavior-x:contain}
.gcar::-webkit-scrollbar{display:none}
.gcard{flex:0 0 85%; scroll-snap-align:start; min-height:212px; text-align:left; display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:18px; border-radius:18px; border:1.5px solid var(--line); background:var(--surface); color:var(--fg); font:inherit}
.gcard.today{border-color:var(--ember); background:linear-gradient(160deg, var(--surface2), var(--surface) 70%)}
.gtags{display:flex; gap:6px; min-height:22px; flex-wrap:wrap}
.gtag{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted)}
.gtag.hot{background:var(--ember); border-color:var(--ember); color:var(--ember-ink)}
.gico{width:48px; height:48px; border-radius:14px; background:var(--surface2); color:var(--ember); display:inline-flex; align-items:center; justify-content:center}
.gico svg{width:26px; height:26px}
.gtitle{font-family:var(--f-display); font-size:24px; font-weight:800; line-height:1.1}
.grule{font-size:16px; line-height:1.35}
.gmore{margin-top:auto; font-weight:600; color:var(--ember); font-size:14px}
.gdots{display:flex; justify-content:center; gap:6px}
.gdots i{width:6px; height:6px; border-radius:3px; background:var(--line); transition:width .2s}
.gdots i.on{width:18px; background:var(--ember)}
.gsrc{font-size:12px}
.gdhead{display:flex; align-items:center; gap:12px; min-width:0}
.gdhead h1{min-width:0; overflow-wrap:anywhere}
.gdrule{font-size:17px; line-height:1.35}
.gtool{border:1.5px solid var(--ember); gap:14px}
.gfields{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
.gvit{display:flex; flex-wrap:wrap; gap:8px}
.gvit .btn{min-height:44px; padding:8px 14px; font-size:15px}
.gvit .btn[aria-pressed="true"]{border-color:var(--ember); color:var(--ember)}
.gout{padding:12px 14px; border-radius:12px; background:var(--surface2); line-height:1.4; border-left:4px solid var(--line)}
.gout.ideal{border-left-color:var(--ok)} .gout.atencao{border-left-color:var(--warn)} .gout.risco{border-left-color:var(--bad)} .gout.invalido{border-left-color:var(--warn)}
.gdnav .btn{flex:1}
.gseg{display:flex; gap:8px}
.gseg .btn{flex:1; min-height:44px}
.gseg .btn[aria-pressed="true"]{border-color:var(--ember); color:var(--ember)}
.gring{position:relative; width:168px; height:168px; align-self:center}
.gring svg{display:block}
.rbg{fill:none; stroke:var(--surface2); stroke-width:10}
.rfg{fill:none; stroke:var(--ember); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .25s linear}
.rnum{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.rnum b{font-family:var(--f-display); font-size:44px; line-height:1}
.rnum span{font-size:12px; color:var(--muted)}
.minitabs{display:flex; gap:6px}
.minitabs button{flex:1; min-height:44px; border-radius:10px; border:1.5px solid var(--line); background:transparent; font-weight:600}
.minitabs button[aria-selected="true"]{background:var(--surface2); border-color:var(--ember)}
.minitabs button{white-space:nowrap; padding:0 6px; min-width:0}
/* Sub-abas da Conta com texto grande do sistema: o rótulo é cortado com reticências, sem passar da borda. */
.minitabs[aria-label="Conta"] button{overflow:hidden; text-overflow:ellipsis}
/* Ponto de mensagem nova na sub-aba: no canto do botão, fora do alcance da reticência quando o texto é grande. */
.minitabs button{position:relative}
.minitabs .tdot{position:absolute; top:7px; right:7px; margin:0}
@media (max-width:400px){ .minitabs button{font-size:14px} }

.stats{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px}
.stat{padding:14px; border-radius:14px; background:var(--surface); display:flex; flex-direction:column; gap:2px; min-width:0}
.stat b{font-family:var(--f-display); font-size:26px; font-weight:800; line-height:1.1; overflow-wrap:anywhere}
.stat span{font-size:13px; color:var(--muted)}

.list{display:flex; flex-direction:column; gap:12px}
.card{padding:16px 18px; border-radius:16px; background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; gap:10px; min-width:0}
.card.live{border-color:var(--ember)}
.card .head{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.card .meta, .meta{font-size:14px; color:var(--muted)}
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; background:var(--surface2); font-size:13px; color:var(--fg); white-space:nowrap}
.chip.st-cesta{color:var(--sand)} .chip.st-estoque{color:var(--ok)} .chip.st-hist{color:var(--muted)}
.tags{display:flex; flex-wrap:wrap; gap:6px}
.meter{display:flex; gap:3px} .meter i{width:16px; height:7px; border-radius:2px; background:var(--line)} .meter i.on{background:var(--ember)}
.score{font-family:var(--f-display); font-weight:800; font-size:30px; line-height:1; color:var(--ember)}
.empty{padding:22px; border-radius:16px; border:1.5px dashed var(--line); color:var(--muted); display:flex; flex-direction:column; gap:10px}
.banner{padding:14px 16px; border-radius:14px; border:1.5px solid var(--warn); display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap}

/* clube */
.phead{display:flex; gap:12px; align-items:center}
.phead .who{flex:1; min-width:0}
.phead b{font-weight:600}
.avatar{width:40px; height:40px; border-radius:50%; background:var(--surface2); color:var(--ember); display:inline-flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:800; font-size:18px; flex-shrink:0; border:1.5px solid var(--line)}
.avatar.sm{width:30px; height:30px; font-size:14px}
.plink{background:none; border:0; padding:0; text-align:left; color:var(--fg)}
.like[aria-pressed="true"]{border-color:var(--ember); color:var(--ember)}
.like[aria-pressed="true"] svg{fill:var(--ember)}
.comments{display:flex; flex-direction:column; gap:12px}
.cmt{display:flex; gap:10px; align-items:flex-start}
.cmt .body{flex:1; min-width:0; background:var(--surface); border-radius:12px; padding:10px 12px}
.cmt .body p{overflow-wrap:anywhere; white-space:pre-wrap}
.badge{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}

/* sessão */
.sbar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); padding-block:12px 10px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px}
.sbar .who{flex:1; min-width:0}
.sbar .who h2{font-size:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tline{flex-basis:100%; display:flex; align-items:center; gap:10px}
.tline .btn{margin-left:auto}
.timer{display:flex; align-items:center; gap:8px}
.timer .clock, .clock{font-family:var(--f-mono); font-size:22px; font-variant-numeric:tabular-nums}
.ring{width:36px; height:36px; flex-shrink:0}
.ring circle{fill:none; stroke-width:4}
.ring .track{stroke:var(--line)} .ring .prog{stroke:var(--ember); stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%}
.ritmo{font-size:12px; color:var(--faint)}
fieldset{border:0; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; min-width:0}
legend{font-weight:600; font-size:15px; padding:0; margin-bottom:10px}
.opts{display:flex; flex-wrap:wrap; gap:8px}
.opt{min-height:40px; padding:7px 13px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font-size:15px; display:inline-flex; align-items:center; gap:7px}
.opt[aria-pressed="true"]{background:var(--ember); border-color:var(--ember); color:var(--ember-ink); font-weight:600}
.dot{width:10px; height:10px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 1px rgba(0,0,0,.25)}
/* Roda de sabores (tela do terço): SVG que ocupa a largura do painel. Fatia marcada: cor cheia da família com texto escuro (contraste de 5:1 ou mais). */
.roda{display:flex; justify-content:center}
.roda-svg{width:100%; max-width:420px; height:auto; display:block; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none}
.roda-svg [role="button"]{cursor:pointer; outline:none}
.roda-svg .sl{stroke:var(--surface); stroke-width:2}
.roda-svg g:focus-visible > .sl, .roda-svg .back:focus-visible .hub{stroke:var(--ember); stroke-width:3.5}
.roda-svg .gen > .sl{stroke:var(--fg); stroke-opacity:.6; stroke-width:1.5; stroke-dasharray:5 4}
.roda-svg .lab{fill:var(--fg); pointer-events:none}
.roda-svg .flab{font-family:var(--f-display); font-weight:600; font-size:13.5px}
.roda-svg .nlab{font-family:var(--f-body); font-weight:600; font-size:12.5px}
.roda-svg .on .nlab{fill:#1A120C}
.roda-svg .chk{fill:none; stroke:#1A120C; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; pointer-events:none}
.roda-svg .hub{fill:var(--surface2); stroke:var(--line); stroke-width:1.5}
.roda-svg .hub-eb{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; fill:var(--ember); pointer-events:none}
.roda-svg .hub-back{font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; fill:var(--ember); pointer-events:none}
.roda-svg .hub-num{font-family:var(--f-display); font-weight:800; font-size:30px; fill:var(--fg); pointer-events:none}
.roda-svg .hub-sub{font-family:var(--f-body); font-size:11px; fill:var(--muted); pointer-events:none}
.roda-svg .hub-fam{font-family:var(--f-display); font-weight:800; font-size:15px}
@keyframes rodaIn{from{transform:rotate(var(--from,0deg)) scale(.45); opacity:0} to{transform:none; opacity:1}}
@keyframes rodaOut{from{transform:scale(1.14); opacity:0} to{transform:none; opacity:1}}
.roda-svg .anim-in{animation:rodaIn .34s cubic-bezier(.2,.8,.2,1) both; transform-box:view-box; transform-origin:0 0}
.roda-svg .anim-out{animation:rodaOut .24s ease-out both; transform-box:view-box; transform-origin:0 0}
@media (prefers-reduced-motion: reduce){ .roda-svg .anim-in, .roda-svg .anim-out{animation:none} }
.rcard{border-radius:12px; background:var(--surface2); padding:14px 16px; display:flex; flex-direction:column; gap:8px}
.rcard .meta{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
.rcard h3{font-size:22px; font-weight:800}
.rcard .lembra{font-size:16px}
.rcard .treino{font-size:14px; color:var(--muted)}
.rsel{display:flex; flex-direction:column; gap:8px}
.rsel .lbl{font-size:12px; font-family:var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.opt .x{font-family:var(--f-mono); color:var(--faint); margin-left:2px}
.rsel .opt, #sabor-res .opt{min-height:44px}
.seg{display:flex; gap:6px}
.seg button{flex:1; min-height:44px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); font-family:var(--f-mono); font-size:16px}
.seg button[aria-pressed="true"]{background:var(--ember); border-color:var(--ember); color:var(--ember-ink)}
.scale{display:flex; justify-content:space-between; font-size:12px; color:var(--faint)}
textarea, input[type=text], input[type=search], input[type=email], input[type=password], input[type=number], select{width:100%; min-height:44px; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--fg); font:inherit}
textarea{min-height:84px; resize:vertical}
label.f{display:flex; flex-direction:column; gap:6px; font-size:14px; color:var(--muted)}
label.check{display:flex; gap:10px; align-items:flex-start; font-size:15px; color:var(--fg)}
label.check input{width:22px; height:22px; margin:1px 0 0; accent-color:var(--ember); flex-shrink:0}
input[type=range]{width:100%; accent-color:var(--ember); min-height:44px}
.rating{display:flex; align-items:baseline; gap:6px}
.rating b{font-family:var(--f-display); font-size:44px; font-weight:800; color:var(--ember); line-height:1}
.panel{padding:16px 18px; border-radius:14px; background:var(--surface); display:flex; flex-direction:column; gap:18px}
.alert{padding:14px 16px; border-radius:12px; border:1.5px solid var(--warn); color:var(--fg); display:flex; flex-direction:column; gap:4px; font-size:15px}
.alert b{color:var(--warn)}
.alert.err{border-color:var(--bad)} .alert.err b{color:var(--bad)}
.hint{font-size:14px; color:var(--muted); padding:12px 14px; border-radius:12px; background:var(--surface2)}
details.terms{font-size:14px; color:var(--muted)}
details.terms summary{cursor:pointer; color:var(--fg); font-weight:600}
details.terms div{display:flex; flex-direction:column; gap:8px; padding-top:10px}

/* fotos da anilha */
.band{display:block; width:100%; max-width:100%; aspect-ratio:16/10; object-fit:contain; background:var(--surface2); border-radius:12px; border:1px solid var(--line)}
.band.thumb{width:84px; aspect-ratio:4/3; object-fit:cover; flex-shrink:0; border-radius:10px}
.band.cmpimg{aspect-ratio:4/3; object-fit:cover}
.bandslot{display:flex; flex-direction:column; gap:10px}
.filebtn{position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:8px}
.filebtn input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; margin:0}
.filebtn:focus-within{outline:2px solid var(--ember); outline-offset:2px}
.withthumb{display:flex; gap:12px; min-width:0; align-items:flex-start}
.durrow{display:grid; grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto; gap:10px; align-items:end}
.durrow input{text-align:center; font-family:var(--f-mono); font-size:18px}

/* detalhe */
.profile{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px}
.third{padding:14px 12px; border-radius:14px; background:var(--surface); display:flex; flex-direction:column; gap:10px; min-width:0}
.bar{height:80px; display:flex; align-items:flex-end; border-bottom:1.5px solid var(--line)}
.bar i{display:block; width:100%; border-radius:6px 6px 0 0; background:var(--ember)}
.third .tags .chip{font-size:12px; padding:2px 8px}
.facts{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.fact{padding:12px 14px; border-radius:12px; background:var(--surface); min-width:0}
.fact span{display:block; font-size:12px; color:var(--faint); font-family:var(--f-mono); letter-spacing:.08em; text-transform:uppercase}
.fact b{font-weight:600; overflow-wrap:anywhere}
.cmp{overflow-x:auto}
.cmp table{width:100%; border-collapse:collapse; font-size:14px; min-width:420px}
.cmp th, .cmp td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top}
.cmp th{color:var(--faint); font-weight:500; width:28%}
.hbars{display:flex; flex-direction:column; gap:10px}
.hbar{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; align-items:center}
.hbar .lab{font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hbar .val{font-family:var(--f-mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; text-align:right}
.hbar .trk{grid-column:1 / -1; height:8px; border-radius:4px; background:var(--surface2); overflow:hidden}
.hbar .trk i{display:block; height:100%; border-radius:4px; background:var(--ember)}
.hbar.dim .trk i{background:var(--faint)}
.insights{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px; font-size:15px}
.chip.up{border:1.5px solid var(--ok)} .chip.down{border:1.5px solid var(--bad)}
.lvl{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:14px}
.lvl b{font-family:var(--f-display); color:var(--ember)}
.xpbar{height:10px; border-radius:5px; background:var(--surface2); overflow:hidden}
.xpbar i{display:block; height:100%; border-radius:5px; background:var(--ember)}
.badges{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.badge2{padding:12px; border-radius:12px; border:1.5px solid var(--line); display:flex; gap:10px; align-items:flex-start; min-width:0}
.badge2.on{border-color:var(--ember); background:var(--surface2)}
.badge2 .ic{width:34px; height:34px; border-radius:50%; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; background:var(--surface2); color:var(--faint)}
.badge2.on .ic{background:var(--ember); color:var(--ember-ink)}
.badge2 b{display:block; font-size:14px} .badge2 span{display:block; font-size:12px; color:var(--muted)}
.badge2:not(.on) b{color:var(--muted)}
.mission{padding:14px 16px; border-radius:12px; border:1.5px dashed var(--ember); display:flex; flex-direction:column; gap:4px; font-size:15px}
.mission.done{border-style:solid; background:var(--surface2)}
.suggest{border-color:var(--ember)}
.ficha{display:flex; flex-direction:column; gap:10px}
.ficha dl{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; margin:0; font-size:14px}
.ficha dt{color:var(--faint)} .ficha dd{margin:0; color:var(--fg)}
details.lesson{border-top:1px solid var(--line); padding-top:10px}
details.lesson summary{display:flex; justify-content:space-between; gap:10px}
@media (max-width:380px){ .badges{grid-template-columns:1fr} }
.appfoot{margin-top:12px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--faint); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:15px}
.kv dt{color:var(--faint)} .kv dd{margin:0; font-weight:600; overflow-wrap:anywhere}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:600; z-index:20; max-width:calc(100% - 32px)}
@media (max-width:420px){ h1{font-size:34px} .stat b{font-size:21px} .timer .clock{font-size:18px} .facts{grid-template-columns:1fr} .tabs button{font-size:14px; padding:0 8px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>

<script>

var FAMILIES=[
  sabFam('fruta','Frutas','','#EE8665','Do cítrico fresco às frutas secas e escuras.','Antes da sessão, cheire uva-passa, ameixa seca e raspas de laranja.',[

  sabFam('flor','Flores','','#C7A0E2','Perfumes de flor, leves e fáceis de perder.','Cheire uma rosa de verdade e um pouco de água de flor de laranjeira.',[

  sabFam('cacau','Cacau e café','','#B58266','Do cacau em pó ao café expresso.','Compare cacau em pó, chocolate ao leite e café moído.',[

    sabNota('Café com leite','Café suavizado pelo leite.',{a:['cappuccino']})]),
  sabFam('castanha','Castanhas','','#D6A35E','Castanhas, nozes e amêndoas, cruas ou torradas.','Prove amêndoa, noz e amendoim torrado lado a lado.',[

/* Missões: sorteadas entre as famílias de aroma. Quatro sabores mudaram de família na 2.12.0; a missão da família antiga continua aceitando cada um. */
var MISSION_FAMS=FAMILIES.filter(function(f){return f.id!=='gosto';}).map(function(f){return f.id;});
var LEGACY_MISSAO={doce:['Doce'],fruta:['Floral'],terra:['Feno'],madeira:['Tostado']};
function normSabor(s){s=String(s==null?'':s).toLowerCase();if(s.normalize)s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');return s.replace(/\s+/g,' ').trim();}
function famOf(n){for(var i=0;i<FAMILIES.length;i++)if(FAMILIES[i].notes.indexOf(n)>=0)return FAMILIES[i];return null;}
function famById(id){for(var i=0;i<FAMILIES.length;i++)if(FAMILIES[i].id===id)return FAMILIES[i];return null;}
function sessNotes(s){var u={},out=[];((s&&s.thirds)||[]).forEach(function(t){(t&&t.notes||[]).forEach(function(n){if(!u[n]){u[n]=1;out.push(n);}});});return out;}
function missionHit(s){var f=s&&s.mission?famById(s.mission):null;if(!f)return [];var old=LEGACY_MISSAO[f.id]||[];
  return sessNotes(s).filter(function(n){return f.notes.indexOf(n)>=0||old.indexOf(n)>=0;});}
function missionDone(s){return missionHit(s).length>0;}
/* Índice da nota no terço pelo texto: uma nota que não é texto (número ou null, de backup editado à mão) também sai pelo chip. */
function notaIdx(arr,val){arr=arr||[];for(var i=0;i<arr.length;i++)if(String(arr[i]==null?'':arr[i])===String(val))return i;return -1;}
/* Busca pelo nome e pelos sinônimos, sem acento: primeiro quem começa pelo texto, depois quem o contém, na ordem da roda. */
function buscaSabores(q,max){q=normSabor(q);if(!q)return [];var ini=[],meio=[];
  FAMILIES.forEach(function(f){f.notes.forEach(function(n){var comeca=false,contem=false;
    [n].concat(NOTA_INFO[n].a).forEach(function(k){var i=normSabor(k).indexOf(q);if(i===0)comeca=true;else if(i>0)contem=true;});
    if(comeca)ini.push(n);else if(contem)meio.push(n);});});
  return ini.concat(meio).slice(0,max||16);}
/* Desenho da roda: SVG com viewBox -180 -180 360 360, centro em (0,0), ângulos em graus no sentido horário a partir do topo.
   Fechada: anel das famílias (f0-f1) e anel fino das notas (t0-t1; a nota marcada vai até t1on). Aberta: as notas da família na roda inteira (i-o). */
var RODA={hub:48,f0:52,f1:140,t0:144,t1:168,t1on:177,i:52,o:175};
function rodaR2(x){return Math.round(x*100)/100;}
function rodaPt(r,a){var t=(a-90)*Math.PI/180;return [rodaR2(r*Math.cos(t))||0,rodaR2(r*Math.sin(t))||0];}
function rodaArc(r0,r1,a0,a1){var lg=(a1-a0)>180?1:0,p0=rodaPt(r1,a0),p1=rodaPt(r1,a1),p2=rodaPt(r0,a1),p3=rodaPt(r0,a0);
  return 'M'+p0[0]+' '+p0[1]+'A'+r1+' '+r1+' 0 '+lg+' 1 '+p1[0]+' '+p1[1]+'L'+p2[0]+' '+p2[1]+'A'+r0+' '+r0+' 0 '+lg+' 0 '+p3[0]+' '+p3[1]+'Z';}
/* Até 11 caracteres, uma linha; depois, quebra no espaço mais perto do meio ou, sem espaço e com mais de 13, no hífen mais perto do meio. */
function rodaLinhas(t){t=String(t);if(t.length<=11)return [t];var i,best=-1,mid=t.length/2;

/* Perfil de paladar: notas médias por marca, linha, origem, capa, formato e forma, e a faixa de força em que as notas ficam na média ou acima. */

var LESSONS=[
  ['anatomia','Anatomia: capa, capote e tripa','<p>Todo charuto premium tem três camadas. A <b>tripa</b> é o miolo, um blend de folhas que define força e sabor. O <b>capote</b> envolve a tripa e dá forma. A <b>capa</b> é a folha externa: a mais bonita e elástica, responde por boa parte do aroma e da primeira impressão.</p><p>Na tripa, as folhas mudam conforme a altura na planta: <b>ligero</b> (topo, mais sol) traz força; <b>seco</b> (meio) traz aroma; <b>volado</b> (base) ajuda a combustão.</p>'],
  ['campo','Do campo ao charuto','<p>As folhas são colhidas aos poucos, de baixo para cima, conforme amadurecem. Depois vem a <b>cura</b>: secagem lenta em casas de tabaco ventiladas, quando a folha perde o verde e ganha cor.</p><p>Na <b>fermentação</b>, as folhas são empilhadas e aquecem naturalmente, liberando amônia e aspereza. Folhas para capa Maduro fermentam por mais tempo. Por fim, o tabaco <b>envelhece</b> e é enrolado à mão pelo torcedor.</p>'],
  ['vitolas','Vitolas e bitola','<p>Vitola é o formato do charuto: comprimento e diâmetro. O diâmetro é medido em <b>ring gauge</b>, em 64 avos de polegada: ring 64 tem 1 polegada (25,4 mm). Um ring 42 tem cerca de 16,7 mm; um 50, cerca de 19,8 mm.</p><p>Formatos clássicos: Petit Corona e Corona (finos), Robusto (curto e grosso), Toro, Churchill (longo). Figurados, como Torpedo e Pirâmide, afinam na cabeça e concentram a fumaça.</p>'],
  ['capas','Capas e cores','<p>A cor da capa vai do claro ao escuro: <b>Claro</b> (Connecticut Shade, suave), <b>Colorado</b> (marrom-avermelhado), <b>Maduro</b> e <b>Oscuro</b> (escuras, adocicadas). Cor escura não significa necessariamente mais força: a força vem principalmente da tripa.</p><p>Capas cultivadas sob tecido (shade grown) recebem menos sol e ficam mais finas e suaves.</p>'],
  ['tripa','Tripa longa e tripa curta','<p>Charutos premium usam <b>tripa longa</b>: folhas inteiras, que correm de ponta a ponta. A queima é mais lenta e uniforme, e o sabor evolui ao longo dos terços.</p><p>Na <b>tripa curta</b> (picada), o tabaco é cortado em pedaços. Queima mais rápido e quente, e costuma ter sabor mais linear.</p>'],
  ['construcao','Como avaliar a construção','<p><b>Antes de acender:</b> a capa deve ser íntegra, com brilho natural de óleo e sem rachaduras. Aperte de leve ao longo do corpo: a firmeza deve ser uniforme, sem pontos moles ou duros. Puxe o ar com o charuto apagado (tiragem a frio): deve passar com leve resistência.</p><p><b>Durante:</b> queima reta, cinza firme e compacta, tiragem constante. Por isso o app pede queima e tiragem no fechamento: são o retrato da construção.</p>'],
  ['descanso','Descanso e envelhecimento','<p>Charuto recém-chegado, de viagem ou da loja, melhora depois de alguns dias de descanso no umidor, entre 65% e 70% de umidade. A umidade se equilibra e a queima fica mais uniforme.</p><p>Com meses e anos de guarda bem feita, os sabores tendem a se integrar e ficar mais redondos. Ninguém sabe ao certo o ponto ideal de cada charuto, e por isso vale anotar no diário.</p>'],
  ['paladar','Treinando o paladar','<p>Na boca sentimos só cinco gostos: doce, salgado, ácido, amargo e umami. Todo o resto (cedro, cacau, castanha) é <b>aroma</b>, percebido pelo nariz. Por isso o retrohale, soltar um pouco de fumaça pelo nariz, revela tanto.</p><p>Para treinar, foque em uma família de cada vez. É o que as missões de aroma do app propõem a cada sessão.</p><p>Na sessão, a roda de sabores ajuda: toque na família que o aroma lembra e depois na nota. Cada nota mostra o que ela lembra e como treinar.</p>']

function relTime(iso){var t=Date.parse(iso);if(!t)return '';var d=(Date.now()-t)/1000;if(d<60)return 'agora';if(d<3600)return 'há '+Math.floor(d/60)+' min';if(d<86400)return 'há '+Math.floor(d/3600)+' h';if(d<172800)return 'ontem';return fmtDate(iso);}
function fmtClock(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;function p(n){return (n<10?'0':'')+n;}return (h?h+':'+p(m):p(m))+':'+p(ss);}

var idb=null;
function openDB(){return new Promise(function(res,rej){if(!window.indexedDB){rej(new Error('sem IndexedDB'));return;}var r=indexedDB.open(APP_ID,2);
  r.onupgradeneeded=function(){var d=r.result;['cigars','sessions','photos','tombstones'].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});});};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.onblocked=function(){rej(new Error('bloqueado'));};});}
function tx(store,mode,fn){return new Promise(function(res,rej){if(!idb){res(undefined);return;}var t,out;try{t=idb.transaction(store,mode);}catch(e){rej(e);return;}var rq=fn(t.objectStore(store));if(rq)rq.onsuccess=function(){out=rq.result;};
  t.oncomplete=function(){res(out);};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error||new Error('abortado'));};});}
function getAll(n){return tx(n,'readonly',function(s){return s.getAll();}).then(function(r){return r||[];});}
function getRec(n,id){return tx(n,'readonly',function(s){return s.get(id);});}
function putRec(n,o){return tx(n,'readwrite',function(s){return s.put(o);});}
function delRec(n,id){return tx(n,'readwrite',function(s){return s.delete(id);});}
function clearStore(n){return tx(n,'readwrite',function(s){return s.clear();});}
function saveErr(e){var q=e&&(e.name==='QuotaExceededError');toast(q?'Sem espaço no celular para salvar. Libere espaço ou remova fotos antigas.':'Não foi possível salvar. Tente de novo.');}

function sortAll(){state.cigars.sort(function(a,b){return (a.order||999)-(b.order||999)||String(a.name).localeCompare(b.name);});state.sessions.sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt));});}
function upsertState(col,obj){var arr=col==='cigars'?state.cigars:state.sessions;var i=arr.findIndex(function(x){return x.id===obj.id;});if(i>=0)arr[i]=clone(obj);else arr.push(clone(obj));sortAll();}
/* Grava no estado e no IndexedDB. A promessa diz se a gravação confirmou (true) ou falhou (false, já com o aviso). */
function put(col,obj){obj.updatedAt=Date.now();upsertState(col,obj);ls('diario-dirty',String(Date.now()));scheduleSync();return putRec(col,clone(obj)).then(function(){return true;},function(e){saveErr(e);return false;});}
function removeSession(id){var s=sessionById(id);state.sessions=state.sessions.filter(function(x){return x.id!==id;});ls('diario-dirty',String(Date.now()));
  return Promise.all([delRec('sessions',id),putRec('tombstones',{id:'sessions:'+id,col:'sessions',localId:id,photo:s&&s.bandId||null})]).then(scheduleSync).catch(saveErr);}
function removePhoto(id){if(!id)return;if(photoURL[id]){try{URL.revokeObjectURL(photoURL[id]);}catch(e){}delete photoURL[id];}
  getRec('photos',id).then(function(p){if(p&&p.remote)putRec('tombstones',{id:'photo:'+id,col:'photo',photo:id}).then(scheduleSync);return delRec('photos',id);}).catch(function(){});}
function addPhoto(blob){var id=uid();return putRec('photos',{id:id,blob:blob,type:blob.type||'image/jpeg',createdAt:new Date().toISOString()}).then(function(){photoURL[id]=URL.createObjectURL(blob);scheduleSync();return id;});}

function loadAll(){return Promise.all([getAll('cigars'),getAll('sessions'),getAll('photos')]).then(function(r){
  state.cigars=r[0];state.sessions=r[1];
  var keep={};r[2].forEach(function(p){keep[p.id]=1;});
  Object.keys(photoURL).forEach(function(k){if(!keep[k]){try{URL.revokeObjectURL(photoURL[k]);}catch(e){}delete photoURL[k];}});
  r[2].forEach(function(p){if(p.blob&&!photoURL[p.id])photoURL[p.id]=URL.createObjectURL(p.blob);});
  sortAll();state.loaded=true;});}

function authErr(e){var m=String(e&&(e.message||e.error_description||e)||'');
  if(/invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';
  if(/already registered|already been registered|user_already_exists/i.test(m))return 'Este e-mail já tem conta. Use "Entrar".';

  if(/terms_required/i.test(m))return 'É preciso aceitar as regras do clube.';
  if(/email.*invalid|invalid.*email/i.test(m))return 'E-mail inválido.';

function cloudInit(){

  try{cloud.sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});}catch(e){cloud.configured=false;return;}
  /* O callback roda dentro da trava de autenticação do supabase-js: adiar qualquer chamada ao banco evita travamento. */
  cloud.sb.auth.onAuthStateChange(function(evt,session){var u=session?session.user:null;
    if((u&&u.id)!==(cloud.user&&cloud.user.id)){cloud.user=u;setTimeout(function(){if(cloud.user)afterLogin();else{cloud._loginFor=null;cloud.profileChecked=true;rerender();}},0);}});
  cloud.sb.auth.getSession().then(function(r){var s=r&&r.data&&r.data.session;cloud.user=s?s.user:null;if(cloud.user)afterLogin();else{cloud.profileChecked=true;cloud.profile=null;rerender();}})
    .catch(function(){cloud.profileChecked=true;rerender();});
}
function afterLogin(){
  var u=cloud.user;if(!u||cloud._loginFor===u.id)return Promise.resolve();cloud._loginFor=u.id;
  /* O estado do clube vem antes da sincronização: membro suspenso não sincroniza. */
  return loadProfile().then(function(){if(!isMember()){rerender();return;}
    return refreshClub(true).then(function(){checkOwner();sync();loadFeed();rerender();});});
}
function loadProfile(){
  var seq=cloud._profSeq=(cloud._profSeq||0)+1;

    if(seq!==cloud._profSeq)return;
    if(r.error)throw r.error;cloud.profile=r.data||null;cloud.profileChecked=true;
    if(cloud.profile)ls('clube-profile',JSON.stringify(cloud.profile));else ls('clube-profile',null);
  }).catch(function(){if(seq!==cloud._profSeq)return;var c=null;try{c=JSON.parse(ls('clube-profile')||'null');}catch(e){}cloud.profile=(c&&c.id===cloud.user.id)?c:null;cloud.profileChecked=true;});

function refreshClub(force){

  var c=cloud.club;if(!force&&Date.now()-c.at<60000)return Promise.resolve();c.at=Date.now();
  return Promise.resolve().then(function(){return clubApi.me();}).then(function(r){
    if(r.error){if(missingSql(r.error)){cloud.clubMissing=true;cloud.me=null;}return;}

function loadMemberClub(){var me=cloud.me,uid=cloud.user.id,c=cloud.club;
  var ps=[clubApi.thread(uid).then(function(r){if(!r.error)c.thread=(r.data||[]).slice().reverse();})];
  if(!me.suspended)ps.push(clubApi.avisos().then(function(r){if(!r.error)c.avisos=r.data||[];}));
  return Promise.all(ps).then(function(){if(me.unread_msgs>0)return clubApi.markRead(uid).then(function(r){if(!r.error)me.unread_msgs=0;});});}
/* Administrador com o Perfil aberto: inscritos sempre; convites, avisos e conversa conforme a seção. */
function loadAdminClub(){var c=cloud.club,open=c.open,ps=[clubApi.members().then(function(r){if(!r.error)c.members=r.data||[];})];
  if(c.sec==='convites')ps.push(clubApi.invites().then(function(r){if(!r.error)c.invites=r.data||[];}));
  if(c.sec==='avisos')ps.push(clubApi.avisos().then(function(r){if(!r.error)c.avisos=r.data||[];}));
  if(open)ps.push(clubApi.thread(open).then(function(r){if(!r.error&&c.open===open)c.thread=(r.data||[]).slice().reverse();}));
  return Promise.all(ps).then(function(){if(!open||c.open!==open)return;var o=c.members.filter(function(m){return m.id===open;})[0];
    if(o&&o.unread>0)return clubApi.markRead(open).then(function(r){if(!r.error){cloud.me.unread_msgs=Math.max(0,(cloud.me.unread_msgs||0)-o.unread);o.unread=0;}});});}
/* Ação de administrador: erro do banco vira aviso em português; sucesso recarrega o painel. */
function admDo(fn,okMsg){Promise.resolve().then(fn).then(function(r){if(r&&r.error){toast(clubErrMsg(r.error));return;}if(okMsg)toast(okMsg);return refreshClub(true);})
  .catch(function(e){toast(clubErrMsg(e));});}
function admConfirm(){var cf=String(state.confirm||''),i=cf.indexOf(':'),kind=cf.slice(0,i),id=cf.slice(i+1);state.confirm='';render();
  if(kind==='susp')admDo(function(){return clubApi.setSuspended(id,true);},'Participação suspensa.');
  else if(kind==='adm')admDo(function(){return clubApi.setAdmin(id,true);},'Agora é administrador.');
  else if(kind==='aviso')admDo(function(){return clubApi.deleteAviso(id);},'Aviso apagado.');}
function memberById(id){return cloud.club.members.filter(function(m){return m.id===id;})[0]||null;}
function publishAviso(){var c=cloud.club;if(c.sending)return;var el=document.getElementById('aviso-body'),v=cleanMsg(el?el.value:c.drafts.aviso);if(el)c.drafts.aviso=el.value;
  if(!v.ok){toast(v.err);return;}c.sending=true;render();
  Promise.resolve().then(function(){return clubApi.postAviso(v.text);}).then(function(r){c.sending=false;if(r.error){toast(clubErrMsg(r.error));render();return;}
    c.drafts.aviso='';toast('Aviso publicado.');return refreshClub(true);}).catch(function(e){c.sending=false;toast(clubErrMsg(e));render();});}

/* Envia na conversa de memberId (a própria, para o inscrito). Um envio por vez; se falhar, o texto fica no campo. */
function sendMsg(memberId){var c=cloud.club;if(c.sending||!memberId)return;
  var k='msg:'+memberId,el=document.getElementById('msg-body'),v=cleanMsg(el?el.value:c.drafts[k]);
  if(el)c.drafts[k]=el.value;
  if(!v.ok){toast(v.err);return;}
  c.sending=true;render();
  Promise.resolve().then(function(){return clubApi.send(memberId,v.text);}).then(function(r){
    c.sending=false;if(r.error){toast(clubErrMsg(r.error));render();return;}
    c.drafts[k]='';render();
    return clubApi.thread(memberId).then(function(t){if(!t.error&&(c.open===memberId||memberId===cloud.user.id))c.thread=(t.data||[]).slice().reverse();render();});
  }).catch(function(e){c.sending=false;toast(clubErrMsg(e));render();});}

/* ---- mapeamento local <-> nuvem ---- */
function nz(v){return (v===''||v===undefined)?null:v;}
function stamp(r){return r.updatedAt||Date.parse(r.createdAt||'')||Date.now();}
function sessionRow(s,u){return {owner_id:u,local_id:s.id,cigar_local_id:nz(s.cigarId),cigar_name:s.cigarName||'Charuto',status:s.status==='concluida'?'concluida':'aberta',
  visibility:s.visibility==='private'?'private':'club',started_at:nz(s.createdAt),ended_at:nz(s.endedAt),moment:nz(s.moment),drink:nz(s.drink),thirds:s.thirds||[],
  strength:s.strength||null,burn:nz(s.burn),draw:nz(s.draw),feel:nz(s.feel),rating:typeof s.rating==='number'?s.rating:null,rebuy:nz(s.rebuy),comment:nz(s.comment),
  duration_min:s.durationMin||null,timer:s.timer||null,band_photo:nz(s.bandId),client_updated_at:stamp(s),updated_at:new Date().toISOString()};}
function rowToSession(r){var t=r.client_updated_at||Date.now();return {id:r.local_id,cigarId:r.cigar_local_id||'',cigarName:r.cigar_name,status:r.status,visibility:r.visibility,
  createdAt:r.started_at||new Date(t).toISOString(),endedAt:r.ended_at||null,moment:r.moment||'',drink:r.drink||'',
  thirds:(r.thirds&&r.thirds.length)?r.thirds:[{notes:[],intensity:0,text:''},{notes:[],intensity:0,text:''},{notes:[],intensity:0,text:''}],
  strength:r.strength||0,burn:r.burn||'',draw:r.draw||'',feel:r.feel||'',rating:r.rating==null?null:Number(r.rating),rebuy:r.rebuy||'',comment:r.comment||'',
  timer:r.timer||{acc:(r.duration_min||0)*60000,running:false,resumedAt:null},durationMin:r.duration_min||0,bandId:r.band_photo||null,updatedAt:t,syncedAt:t};}
function cigarRow(c,u){return {owner_id:u,local_id:c.id,name:c.name||'Charuto',origin:nz(c.origin),vitola:nz(c.vitola),strength:c.strength||null,status:nz(c.status),
  expected:nz(c.expected),pairing:nz(c.pairing),sort_order:c.order||null,band_photo:nz(c.bandId),wrapper:nz(c.wrapper),client_updated_at:stamp(c),updated_at:new Date().toISOString()};}
function rowToCigar(r){var t=r.client_updated_at||Date.now();return {id:r.local_id,name:r.name,origin:r.origin||'',vitola:r.vitola||'',strength:r.strength||0,status:r.status||'historico',
  expected:r.expected||'',pairing:r.pairing||'',order:r.sort_order||999,bandId:r.band_photo||null,wrapper:r.wrapper||'',updatedAt:t,syncedAt:t};}

/* ---- sincronização (o celular é a fonte; a nuvem é cópia e vitrine do clube) ---- */
function sync(){
  if(!canSync()){if(isMember()&&navigator.onLine===false)setStatus('offline');return Promise.resolve();}
  if(syncing){syncAgain=true;return Promise.resolve();}
  syncing=true;setStatus('syncing');
  var sb=cloud.sb,u=cloud.user.id;
  return (async function(){
    ls('clube-owner',u);
    var refs={};state.sessions.forEach(function(s){if(s.bandId)refs[s.bandId]=1;});state.cigars.forEach(function(c){if(c.bandId)refs[c.bandId]=1;});
    var photos=await getAll('photos');
    for(var i=0;i<photos.length;i++){var p=photos[i];if(p.foreign||p.remote||!refs[p.id])continue;
      var up=await sb.storage.from('bands').upload(u+'/'+p.id+'.jpg',p.blob,{upsert:true,contentType:p.type||'image/jpeg'});
      if(up.error)throw up.error;p.remote=true;await putRec('photos',p);}
    var tombs=await getAll('tombstones');
    for(var j=0;j<tombs.length;j++){var t=tombs[j];
      if(t.col==='photo'){await sb.storage.from('bands').remove([u+'/'+t.photo+'.jpg']);}
      else{var d=await sb.from(t.col).delete().eq('owner_id',u).eq('local_id',t.localId);if(d.error)throw d.error;
        if(t.photo)await sb.storage.from('bands').remove([u+'/'+t.photo+'.jpg']);}
      await delRec('tombstones',t.id);}
    var dc=state.cigars.filter(isDirty),ds=state.sessions.filter(isDirty);
    if(dc.length){var rc=await sb.from('cigars').upsert(dc.map(function(c){return cigarRow(c,u);}),{onConflict:'owner_id,local_id'});if(rc.error)throw rc.error;}
    if(ds.length){var rs=await sb.from('sessions').upsert(ds.map(function(s){return sessionRow(s,u);}),{onConflict:'owner_id,local_id'});if(rs.error)throw rs.error;}
    for(var a=0;a<dc.length;a++){var cur=await getRec('cigars',dc[a].id);if(cur&&cur.updatedAt===dc[a].updatedAt){cur.syncedAt=stamp(cur);await putRec('cigars',cur);}}
    for(var b=0;b<ds.length;b++){var cs=await getRec('sessions',ds[b].id);if(cs&&cs.updatedAt===ds[b].updatedAt){cs.syncedAt=stamp(cs);await putRec('sessions',cs);}}
    await loadAll();
    var pc=await sb.from('cigars').select('*').eq('owner_id',u);if(pc.error)throw pc.error;
    var ps=await sb.from('sessions').select('*').eq('owner_id',u);if(ps.error)throw ps.error;
    await mergeRemote('cigars',pc.data||[],rowToCigar);
    await mergeRemote('sessions',ps.data||[],rowToSession);
    await loadAll();
    var need=[];state.sessions.concat(state.cigars).forEach(function(r){if(r.bandId&&!photoURL[r.bandId]&&need.indexOf(r.bandId)<0)need.push(r.bandId);});
    for(var k=0;k<need.length;k++){var dl=await sb.storage.from('bands').download(u+'/'+need[k]+'.jpg');
      if(!dl.error&&dl.data){await putRec('photos',{id:need[k],blob:dl.data,type:dl.data.type||'image/jpeg',remote:true,createdAt:new Date().toISOString()});}}
    if(need.length)await loadAll();
    cloud.lastSync=Date.now();ls('clube-last-sync',String(cloud.lastSync));
  })().then(function(){syncing=false;setStatus('ok');if(syncAgain){syncAgain=false;scheduleSync();}if(state.tab==='clube')loadFeed();})
    .catch(function(e){syncing=false;setStatus(navigator.onLine===false?'offline':'error',authErr(e));});
}
async function mergeRemote(col,rows,conv){
  var local={};(col==='cigars'?state.cigars:state.sessions).forEach(function(r){local[r.id]=r;});
  var seen={};
  for(var i=0;i<rows.length;i++){var r=conv(rows[i]);seen[r.id]=1;var l=local[r.id];
    if(draft&&draft.id===r.id)continue;
    if(!l||(!isDirty(l)&&(r.updatedAt||0)>(l.updatedAt||0)))await putRec(col,r);}
  if(rows.length<1000){var ids=Object.keys(local);for(var j=0;j<ids.length;j++){var x=local[ids[j]];
    if(!seen[x.id]&&x.syncedAt&&!isDirty(x)&&!(draft&&draft.id===x.id))await delRec(col,x.id);}}
}
function resetSyncFlags(){return Promise.all([getAll('cigars'),getAll('sessions'),getAll('photos')]).then(function(r){
  var ops=[];r[0].forEach(function(c){delete c.syncedAt;ops.push(putRec('cigars',c));});r[1].forEach(function(s){delete s.syncedAt;ops.push(putRec('sessions',s));});
  r[2].forEach(function(p){if(!p.foreign){delete p.remote;ops.push(putRec('photos',p));}});return Promise.all(ops).then(function(){return clearStore('tombstones');});}).then(loadAll);}

/* ---- feed ---- */
var FEED_COLS='uid,owner_id,local_id,cigar_name,started_at,ended_at,moment,drink,thirds,strength,rating,rebuy,comment,duration_min,band_photo,burn,draw,feel,profiles!sessions_owner_id_fkey(display_name)';
function loadFeed(){
  if(!isMember()||cloud.feedLoading||isSuspended())return Promise.resolve();
  cloud.feedLoading=true;rerender();var sb=cloud.sb;
  return (async function(){
    var r=await sb.from('sessions').select(FEED_COLS).eq('visibility','club').eq('status','concluida').order('ended_at',{ascending:false}).limit(60);
    if(r.error)throw r.error;var items=r.data||[],ids=items.map(function(x){return x.uid;}),likes={},comments={};
    if(ids.length){
      var rr=await sb.from('reactions').select('session_uid,user_id').in('session_uid',ids);if(rr.error)throw rr.error;
      (rr.data||[]).forEach(function(x){(likes[x.session_uid]=likes[x.session_uid]||[]).push(x.user_id);});
      var rc=await sb.from('comments').select('id,session_uid,user_id,body,created_at,profiles(display_name)').in('session_uid',ids).order('created_at',{ascending:true});if(rc.error)throw rc.error;
      (rc.data||[]).forEach(function(x){(comments[x.session_uid]=comments[x.session_uid]||[]).push(x);});}
    cloud.feed=items;cloud.likes=likes;cloud.comments=comments;cloud.feedAt=Date.now();cloud.feedError='';
    ls('clube-feed',JSON.stringify({items:items,likes:likes,comments:comments,at:cloud.feedAt}));
  })().then(function(){cloud.feedLoading=false;rerender();fetchFeedPhotos();})
    .catch(function(e){cloud.feedLoading=false;cloud.feedError=navigator.onLine===false?'Sem internet. Mostrando o último feed carregado.':authErr(e);rerender();});
}
function feedPhotoKey(it){if(!it.band_photo)return null;if(cloud.user&&it.owner_id===cloud.user.id&&photoURL[it.band_photo])return it.band_photo;return 'r:'+it.owner_id+'/'+it.band_photo;}
function fetchFeedPhotos(){
  if(!isMember())return;
  cloud.photoFail=cloud.photoFail||{};

async function submitAuth(form){
  var mode=form.getAttribute('data-mode'),sb=cloud.sb;
  var email=(document.getElementById('au-email')||{}).value||'',pass=(document.getElementById('au-pass')||{}).value||'';
  var name=((document.getElementById('au-name')||{}).value||'').trim(),code=((document.getElementById('au-code')||{}).value||'').trim().toUpperCase();
  var adult=!!(document.getElementById('au-adult')||{}).checked,terms=!!(document.getElementById('au-terms')||{}).checked;
  cloud.form={name:name,email:email,pass:pass,code:code,adult:adult,terms:terms};
  cloud.authMsg='';
  if(mode!=='entrar'){if(!name){cloud.authMsg='Informe seu nome de exibição.';render();return;}if(!code){cloud.authMsg='Informe o código do convite.';render();return;}
    if(!adult){cloud.authMsg='O clube é exclusivo para maiores de 18 anos.';render();return;}if(!terms){cloud.authMsg='É preciso aceitar as regras do clube.';render();return;}}
  cloud.authBusy=true;render();
  try{
    if(mode==='entrar'){var r=await sb.auth.signInWithPassword({email:email.trim(),password:pass});if(r.error)throw r.error;cloud.user=r.data.user;}
    else if(mode==='criar'){
      var s=await sb.auth.signUp({email:email.trim(),password:pass,options:{data:{display_name:name}}});if(s.error)throw s.error;
      if(!s.data.session){cloud.authBusy=false;cloud.authMsg='Conta criada, mas o clube está exigindo confirmação por e-mail. Avise o administrador: é preciso desligar "Confirm email" no Supabase.';render();return;}
      cloud.user=s.data.user;}
    if(mode!=='entrar'){var j=await sb.rpc('join_club',{p_code:code,p_name:name,p_adult:adult,p_terms:terms});if(j.error)throw j.error;ls('clube-convite',null);inviteCode='';}
    cloud._loginFor=null;await afterLogin();cloud.authBusy=false;cloud.form=null;
    toast(isMember()?'Bem-vindo ao clube, '+cloud.profile.display_name+'!':'Conectado.');render();
  }catch(e){cloud.authBusy=false;cloud.authMsg=authErr(e);render();}
}

/* ---------- backup ---------- */
function blobToDataURL(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsDataURL(b);});}
function buildBackup(){return getAll('photos').then(function(ps){ps=ps.filter(function(p){return !p.foreign;});return Promise.all(ps.map(function(p){return blobToDataURL(p.blob).then(function(d){return {id:p.id,createdAt:p.createdAt,dataUrl:d};});}));}).then(function(photos){
  function strip(r){var c=clone(r);delete c.syncedAt;return c;}
  return {app:APP_ID,version:BACKUP_VERSION,exportedAt:new Date().toISOString(),cigars:state.cigars.map(strip),sessions:state.sessions.map(strip),photos:photos};});}
function backupFile(){return buildBackup().then(function(b){var name='diario-degustacao-'+new Date().toISOString().slice(0,10)+'.json';var blob=new Blob([JSON.stringify(b)],{type:'application/json'});var file=null;try{file=new File([blob],name,{type:'application/json'});}catch(e){}return {blob:blob,file:file,name:name};});}
function markBackup(){ls('diario-last-backup',String(Date.now()));}
function exportDownload(){backupFile().then(function(f){var a=document.createElement('a');a.href=URL.createObjectURL(f.blob);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},4000);markBackup();render();toast('Backup salvo em Downloads');}).catch(function(){toast('Não foi possível gerar o backup.');});}
function exportShare(){backupFile().then(function(f){if(!(f.file&&navigator.canShare&&navigator.canShare({files:[f.file]}))){toast('Compartilhamento indisponível. Use "Salvar backup".');return;}
  return navigator.share({files:[f.file],title:'Backup do Diário de Degustação'}).then(function(){markBackup();render();toast('Backup compartilhado');});}).catch(function(e){if(e&&e.name==='AbortError')return;toast('Não foi possível compartilhar o backup.');});}
function dataURLToBlob(d){return fetch(d).then(function(r){return r.blob();});}
function importFile(file){
  if(!file)return;busy.importing=true;render();
  file.text().then(function(txt){var b=JSON.parse(txt);if(!b||b.app!==APP_ID)throw new Error('formato');
    var cs=Array.isArray(b.cigars)?b.cigars:[],ss=Array.isArray(b.sessions)?b.sessions:[],ps=Array.isArray(b.photos)?b.photos:[];
    var chain=Promise.resolve(),nP=0,now=Date.now();
    cs.forEach(function(c){if(c&&c.id){delete c.syncedAt;c.updatedAt=now;chain=chain.then(function(){return putRec('cigars',c);});}});
    ss.forEach(function(s){if(s&&s.id){delete s.syncedAt;s.updatedAt=now;chain=chain.then(function(){return putRec('sessions',s);});}});
    ps.forEach(function(p){if(p&&p.id&&typeof p.dataUrl==='string'&&p.dataUrl.indexOf('data:image/')===0)chain=chain.then(function(){return dataURLToBlob(p.dataUrl).then(function(bl){nP++;return putRec('photos',{id:p.id,blob:bl,type:bl.type,createdAt:p.createdAt||new Date().toISOString()});});});});
    return chain.then(loadAll).then(function(){busy.importing=false;state.tab='acervo';render();scheduleSync();toast('Importados: '+cs.length+' charutos, '+ss.length+' sessões, '+nP+' fotos');});
  }).catch(function(e){busy.importing=false;render();toast(e&&e.message==='formato'?'Este arquivo não é um backup do Diário de Degustação.':'Não foi possível ler o arquivo de backup.');});
}
function needsBackup(){var dirty=Number(ls('diario-dirty')||0),last=Number(ls('diario-last-backup')||0);return state.sessions.length>0&&dirty>last&&!isMember();}

function statusLine(){
  if(state.dbError)return '<span class="sdot bad"></span>Este navegador bloqueou o armazenamento. Abra pelo Chrome, fora da aba anônima.';
  if(!state.loaded)return 'Carregando seus registros…';
  if(!cloud.configured)return '<span class="sdot"></span>Registros salvos neste celular.';
  if(!isMember())return '<span class="sdot"></span>Registros neste celular. Entre no clube em Conta › Perfil para sincronizar.';
  if(cloud.ownerMismatch)return '<span class="sdot bad"></span>Sincronização pausada: os registros deste aparelho são de outra conta.';
  if(isSuspended())return '<span class="sdot warn"></span>Participação no clube suspensa. O diário continua neste celular.';
  var s=cloud.status;
  if(s==='syncing')return '<span class="sdot warn"></span>Sincronizando com o clube…';
  if(s==='offline')return '<span class="sdot warn"></span>Sem internet. Tudo fica salvo no celular e sobe quando voltar o sinal.';

function clubButton(){if(!cloud.configured)return '';var on=state.tab==='clube',lbl=isMember()?'Abrir o clube':'Entrar no clube';

function viewHeader(){var j=state.loaded&&done().length?journey():null;return '<header class="top"><div class="toprow"><div class="toptitle"><div class="eyebrow">Charutos · paladar e sensações</div><h1>Diário de Degustação</h1></div>'+clubButton()+'</div>'+(j?'<button class="linkbtn lvl" style="text-decoration:none" data-act="tab" data-id="paladar"><b>'+esc(j.name)+'</b><span class="num faint">'+j.xp+' pts · '+j.on.length+' conquistas</span></button>':'')+'<p class="mode">'+statusLine()+'</p></header>';}
/* Conta: Histórico, Paladar, Cesta e Perfil são sub-abas dela (2.11.0). Os valores de state.tab não mudaram;
   'conta' é o Perfil. state.contaSec guarda a última sub-aba aberta nesta sessão do app, só na memória. */
var CONTA_SECS=[['historico','Histórico'],['paladar','Paladar'],['cesta','Cesta'],['conta','Perfil']];
function isContaSec(t){for(var i=0;i<CONTA_SECS.length;i++)if(CONTA_SECS[i][0]===t)return true;return false;}
function unreadMsgs(){return isMember()&&cloud.me?(cloud.me.unread_msgs||0):0;}
function novaMsg(){return unreadMsgs()>0;}
/* Desvio para o Perfil: só com mais mensagens não lidas do que as já vistas no Perfil (state.msgVisto, gravado em viewHome). */
function msgNaoVista(){return unreadMsgs()>(state.msgVisto||0);}
function contaTabs(){var nm=novaMsg();
  return '<div class="minitabs" role="tablist" aria-label="Conta">'+CONTA_SECS.map(function(t){var dot=nm&&t[0]==='conta';
    return '<button role="tab" aria-selected="'+(state.tab===t[0])+'" data-act="tab" data-id="'+t[0]+'"'+(dot?' aria-label="Perfil, nova mensagem"':'')+'>'+t[1]+(dot?'<span class="tdot" aria-hidden="true"></span>':'')+'</button>';}).join('')+'</div>';}
function viewHome(){
  if(isContaSec(state.tab))state.contaSec=state.tab;
  /* Mensagens vistas: o Perfil aberto vale como visto. Se as não lidas caem com o Perfil fechado (lidas em outro aparelho, outra conta),
     o celular não sabe se chegou mensagem nova junto com a queda; as que sobraram contam como não vistas (visto volta a 0). */
  var un=unreadMsgs();if(state.tab==='conta')state.msgVisto=un;else if((state.msgVisto||0)>un)state.msgVisto=0;
  var h=viewHeader();
  var live=openSession();
  if(live){h+='<div class="card live"><div class="head"><div><div class="eyebrow">Sessão em andamento</div><h3>'+esc(live.cigarName)+'</h3><div class="meta num">'+fmtClock(elapsed(live))+' · '+esc(live.moment||'momento não marcado')+'</div></div><button class="btn primary" data-act="resume" data-id="'+esc(live.id)+'">Retomar</button></div></div>';}
  var nm=novaMsg(),naConta=isContaSec(state.tab);
  h+='<div class="tabs" role="tablist" aria-label="Seções">'+[['inicio','Início'],['acervo','Acervo'],['conta','Conta']].map(function(t){var hub=t[0]==='conta',dot=hub&&nm;
    return '<button role="tab" aria-selected="'+(hub?naConta:state.tab===t[0])+'" data-act="tab" data-id="'+t[0]+'"'+(hub?' data-hub="1"':'')+(dot?' aria-label="Conta, nova mensagem"':'')+'>'+t[1]+(dot?'<span class="tdot" aria-hidden="true"></span>':'')+'</button>';}).join('')+'</div>';
  if(naConta)h+=contaTabs();
  /* A faixa de backup e o resumo do diário ficam abaixo das abas: a barra e as sub-abas não mudam de lugar entre as abas. */
  if(needsBackup()&&state.tab!=='conta')h+='<div class="banner"><span>Há registros novos sem backup.</span><button class="btn small" data-act="tab" data-id="conta">Fazer backup</button></div>';
  if(state.tab==='acervo'||state.tab==='historico'){var ds=done();
    if(ds.length){var rated=ds.filter(function(s){return typeof s.rating==='number';});
      var mean=rated.length?(rated.reduce(function(a,s){return a+s.rating;},0)/rated.length):null;
      var best=rated.slice().sort(function(a,b){return b.rating-a.rating;})[0];
      h+='<div class="stats"><div class="stat"><b class="num">'+ds.length+'</b><span>sessões</span></div><div class="stat"><b class="num">'+(mean==null?'—':numStr(mean.toFixed(1)))+'</b><span>nota média</span></div><div class="stat"><b>'+esc(best?best.cigarName.split(' (')[0]:'—')+'</b><span>favorito</span></div></div>';}}
  if(state.tab==='inicio')h+=viewInicio();
  else if(state.tab==='acervo')h+=viewAcervo();
  else if(state.tab==='historico')h+=viewHistorico();
  else if(state.tab==='clube')h+=viewClube();
  else if(state.tab==='cesta')h+=viewCesta();
  else if(state.tab==='paladar')h+=viewPaladar();
  else h+=viewConta();
  return h;
}

function optBtns(field,list,val){return '<div class="opts">'+list.map(function(o){return '<button type="button" class="opt" aria-pressed="'+(val===o)+'" data-act="set" data-field="'+field+'" data-val="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+'</div>';}

function bandSlot(s){

function durMin(s){return Math.max(0,Math.round(elapsed(s)/60000));}

function cohMsg(s){if(typeof s.rating!=='number'||!s.rebuy)return '';

  if(s.rating>=8&&s.rebuy==='Não')return 'Nota '+numStr(s.rating)+' e não recompraria? Se foi por preço ou disponibilidade, vale anotar na impressão final.';return '';}
function viewSession(){
  var s=draft, run=s.timer&&s.timer.running, editing=s.status==='concluida';
  var steps=['1º terço','2º terço','3º terço','Fechamento'];
  var h='<div class="sbar"><button class="btn small ghost" data-act="home" aria-label="Voltar ao início">Início</button><div class="who"><h2>'+esc(s.cigarName)+'</h2></div>';
  if(editing)h+='<div class="tline"><span class="eyebrow">Editando registro</span><span class="clock num" id="clock" style="margin-left:auto">'+fmtDur(durMin(s))+'</span></div></div>';
  else h+='<div class="tline"><div class="timer"><svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="track" cx="20" cy="20" r="16"></circle><circle class="prog" id="ring" cx="20" cy="20" r="16" stroke-dasharray="100.53" stroke-dashoffset="100.53"></circle></svg><span class="clock" id="clock">'+fmtClock(elapsed(s))+'</span></div><span class="ritmo">1 baforada a cada 30 a 60 s</span>'+

    h+=cigarField(s);

      '<label class="f" for="dur-h">Horas<input type="number" id="dur-h" min="0" max="10" inputmode="numeric" value="'+hh+'" data-input="dur"></label>'+
      '<label class="f" for="dur-m">Minutos<input type="number" id="dur-m" min="0" max="59" inputmode="numeric" value="'+mm+'" data-input="dur"></label>'+
      '<button type="button" class="btn" data-act="dur" data-val="5" aria-label="Aumentar 5 minutos">+5</button></div>'+
      '<p class="faint" style="font-size:13px">Corrija aqui se o cronômetro ficou ligado ou foi pausado sem querer. Mínimo de 1 minuto.</p></fieldset></div>';}
  h+='<div class="panel"><fieldset><legend>Momento</legend>'+optBtns('moment',MOMENTS,s.moment)+'</fieldset><fieldset><legend>Bebida</legend>'+optBtns('drink',DRINKS,s.drink)+'</fieldset>'+bandSlot(s)+'</div>';

      '<div class="roda" id="roda">'+rodaSvg({fam:state.rodaFam,sel:t.notes,terco:steps[state.step],anim:state.rodaAnim})+'</div>'+
      '<div class="rcard" id="roda-card" aria-live="polite">'+rodaCartao({foco:state.rodaFoco,sel:t.notes,terco:steps[state.step]})+'</div>'+
      '<div class="rsel" id="roda-sel">'+rodaChips(t.notes)+'</div>'+
      '<label class="f" for="sabor-q">Buscar pelo nome<input type="search" id="sabor-q" data-saborq value="'+esc(state.saborQ||'')+'" placeholder="ex.: canela, cedro, chumbo" autocomplete="off"></label>'+

    h+='<label class="f" for="t-text">Anotações deste terço<textarea id="t-text" data-input="thirdText" placeholder="ex.: começou com feno e mel, retrogosto com pimenta branca">'+esc(t.text)+'</textarea></label>';

    h+='<fieldset><legend>Nota geral</legend><div class="rating"><b class="num" id="ratingOut">'+(typeof s.rating==='number'?numStr(s.rating):'—')+'</b><span class="muted">de 10</span></div><input type="range" id="rating" min="0" max="10" step="0.5" value="'+(typeof s.rating==='number'?s.rating:7)+'" data-input="rating" aria-label="Nota geral de 0 a 10"></fieldset>'+

    if(cloud.configured)h+='<fieldset><legend>Compartilhar no clube</legend><div class="opts"><button type="button" class="opt" aria-pressed="'+(vis==='club')+'" data-act="vis" data-val="club">Clube</button><button type="button" class="opt" aria-pressed="'+(vis==='private')+'" data-act="vis" data-val="private">Só eu</button></div><p class="faint" style="font-size:13px">'+(vis==='club'?'Ao encerrar, os membros do clube veem esta sessão, a foto da anilha e podem curtir e comentar.':'Fica só no seu diário. Ninguém do clube vê.')+'</p></fieldset>';

  }

  for(var i=0;i<ts.length;i++){var t=ts[i],max=+t.getAttribute('data-max'),w;t.style.fontSize='';
    try{w=t.getBBox().width;}catch(e){continue;}
    if(w>max){var fs=parseFloat(getComputedStyle(t).fontSize)||12;t.style.fontSize=(fs*max/w).toFixed(2)+'px';}}}
/* Foco no redesenho da sessão: o campo de busca volta com o cursor; um botão da roda, do cartão, dos chips ou da busca volta ao mesmo
   data-act e data-id/data-val na mesma área. Se a fatia sumiu, o foco vai para a primeira nota da roda aberta ou para a família que fechou. */
var RODA_AREAS=['roda','roda-card','roda-sel','sabor-res'];
function rodaFocoAntes(){var ae=document.activeElement;if(!ae||!ae.getAttribute)return null;
  if(ae.id==='sabor-q')return {busca:true,s:[ae.selectionStart,ae.selectionEnd]};
  var act=ae.getAttribute('data-act'),area=act&&ae.closest?ae.closest('#'+RODA_AREAS.join(',#')):null;if(!area)return null;

  if(fz.busca){el=document.getElementById('sabor-q');if(el){el.focus({preventScroll:true});try{el.setSelectionRange(fz.s[0],fz.s[1]);}catch(e){}}return;}
  el=document.querySelector('#'+fz.area+' [data-act="'+fz.act+'"]'+(fz.id!=null?'[data-id="'+CSS.escape(fz.id)+'"]':'')+(fz.val!=null?'[data-val="'+CSS.escape(fz.val)+'"]':''));
  if(!el&&fz.area==='roda')el=state.rodaFam?document.querySelector('#roda [data-act="note"]'):(state.rodaFoco&&state.rodaFoco.t==='fam'?document.querySelector('#roda [data-act="roda-fam"][data-id="'+CSS.escape(state.rodaFoco.id)+'"]'):null);

function compress(file){return new Promise(function(res){var url;try{url=URL.createObjectURL(file);}catch(e){res(file);return;}var img=new Image();
  img.onload=function(){try{var max=1400,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(function(b){res(b||file);},'image/jpeg',0.85);}catch(e){URL.revokeObjectURL(url);res(file);}};

    case 'catcesta': addFromCatalog(id); break;
    case 'novo-charuto': state.tab='acervo'; state.view='home'; state.acvFilter='todos'; state.addOpen=true; state.editCigar=null; state.confirm=''; render(); var nf=document.getElementById('nc-name'); if(nf)nf.focus(); break;
    case 'export': exportDownload(); break;
    case 'share': exportShare(); break;
    case 'install': if(installPrompt){installPrompt.prompt();installPrompt.userChoice.then(function(){installPrompt=null;render();}).catch(function(){});} break;
    case 'authmode': cloud.authMode=id; cloud.authMsg=''; render(); break;
    case 'signout': signOut(); break;
    case 'askconfirm': state.confirm=id; render(); break;
    case 'cancelconfirm': state.confirm=''; render(); break;
    case 'deleteaccount': deleteAccount(); break;
    case 'wipe': wipeLocalForAccount(); break;
    case 'syncnow': refreshClub(true).then(function(){sync();}); break;
    case 'savename': saveName(); break;
    case 'newinvite': createInvite(); break;
    case 'admsec': cloud.club.sec=id; cloud.club.open=null; state.confirm=''; render(); refreshClub(true); break;
    case 'admopen': cloud.club.sec='mensagens'; cloud.club.open=id; cloud.club.thread=[]; state.confirm=''; render(); refreshClub(true); break;
    case 'admclose': cloud.club.open=null; cloud.club.thread=[]; render(); break;
    case 'admsusp': var admS=memberById(id); if(admS&&admS.suspended_at)admDo(function(){return clubApi.setSuspended(id,false);},'Participação reativada.'); else{state.confirm='susp:'+id; render();} break;
    case 'admadm': var admA=memberById(id); if(admA&&admA.is_admin)admDo(function(){return clubApi.setAdmin(id,false);},'Deixou de ser administrador.'); else{state.confirm='adm:'+id; render();} break;
    case 'admconfirm': admConfirm(); break;
    case 'avisopub': publishAviso(); break;
    case 'avisodel': state.confirm='aviso:'+id; render(); break;
    case 'invoff': admDo(function(){return clubApi.setInvite(id,false);},'Convite desativado.'); break;
    case 'copyinvite': copyText('invite-link',cloud.inviteLink); break;
    case 'shareinvite': navigator.share({title:'Convite para o Clube do Diário de Degustação',text:'Te convidei para o nosso clube de degustação de charutos. Abra no Chrome (Android) ou Safari (iPhone):',url:cloud.inviteLink}).catch(function(){}); break;
    case 'refreshfeed': loadFeed(); break;
    case 'clubrefresh': refreshClub(true); break;
    case 'msgsend': sendMsg(id); break;
    case 'avisook': dismissAviso(); break;
    case 'avisover': state.tab='conta'; state.view='home'; dismissAviso(); refreshClub(true).then(function(){var a=document.getElementById('avisos');if(a)a.scrollIntoView({block:'start'});}); break;
    case 'post': state.view='post'; state.postUid=id; render(); window.scrollTo(0,0); fetchFeedPhotos(); break;
    case 'backclube': state.view='home'; state.tab='clube'; render(); break;
    case 'like': toggleLike(id); break;
    case 'comment': addComment(id); break;
    case 'delcomment': deleteComment(id,state.postUid); break;
  }
});
document.addEventListener('input',function(ev){var el=ev.target,k=el.getAttribute&&el.getAttribute('data-gin');if(!k)return;
  if(k==='umid')state.umid=el.value;else if(k==='temp')state.temp=el.value;
  var o=document.getElementById('umid-out');if(o){var r=humidorStatus(state.umid,state.temp);o.textContent=r.texto;o.className='gout '+r.nivel;}});
/* Rascunhos de mensagem e de aviso: sobrevivem aos redesenhos. */
document.addEventListener('input',function(ev){var el=ev.target,k=el&&el.getAttribute&&el.getAttribute('data-cin');if(k)cloud.club.drafts[k]=el.value;});
/* Busca da roda de sabores: atualiza só a lista, sem render(), para o campo não perder o foco. */
document.addEventListener('input',function(ev){var el=ev.target;if(!el||!el.hasAttribute||!el.hasAttribute('data-saborq')||!draft)return;
  state.saborQ=el.value;var o=document.getElementById('sabor-res');if(o)o.innerHTML=rodaBuscaHtml(state.saborQ,draft.thirds[state.step].notes);});
/* Enter e Espaço acionam os botões desenhados em SVG (role="button" com data-act, que não são <button>). */
document.addEventListener('keydown',function(ev){var t=ev.target;
  if((ev.key!=='Enter'&&ev.key!==' ')||!t||!t.getAttribute||t.getAttribute('role')!=='button'||!t.hasAttribute('data-act')||String(t.tagName).toLowerCase()==='button')return;
  ev.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));});
/* Busca da curadoria: atualiza só a lista, sem render(), para o campo não perder o foco. */
document.addEventListener('input',function(ev){var el=ev.target;if(!el||!el.hasAttribute||!el.hasAttribute('data-catq'))return;
  state.catQ=el.value;state.catN=12;var o=document.getElementById('cat-list');if(o)o.innerHTML=catListHtml();});
document.addEventListener('input',function(ev){
  var el=ev.target, k=el.getAttribute('data-input'); if(!k||!draft)return;
  if(k==='thirdText')draft.thirds[state.step].text=el.value;
  else if(k==='comment')draft.comment=el.value;
  else if(k==='cigarName'){var nm=el.value.trim();if(!nm)return;setCigarName(nm);}
  else if(k==='dur'){var hv=parseInt(document.getElementById('dur-h').value,10)||0,mv=parseInt(document.getElementById('dur-m').value,10)||0;if(hv*60+mv<1)return;setDuration(hv*60+mv);}
  else if(k==='rating'){draft.rating=Number(el.value);var o=document.getElementById('ratingOut');if(o)o.textContent=numStr(draft.rating);var ch=document.getElementById('coh-hint');if(ch){var m=cohMsg(draft);ch.textContent=m;ch.hidden=!m;}}
  scheduleSave();
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='band-camera'||el.id==='band-gallery'){var f=el.files&&el.files[0];el.value='';handleBandFile(f);return;}
  if(el.id==='import-file'){var g=el.files&&el.files[0];el.value='';importFile(g);return;}
  if(el.getAttribute('data-change')==='cigar'&&draft){
    if(el.value==='__outro'){state.cigarCustom=true;draft.cigarId='';}
    else{var cc=cigarById(el.value);if(cc){state.cigarCustom=false;draft.cigarId=cc.id;setCigarName(cc.name);}}
    scheduleSave();render();if(state.cigarCustom){var ni=document.getElementById('ed-cigar-name');if(ni){ni.focus();ni.select();}}return;}
  var w=el.getAttribute('data-cmp');if(!w)return;if(w==='A')state.cmpA=el.value;else state.cmpB=el.value;render();
});
document.addEventListener('submit',function(ev){
  var fm=ev.target;
  if(fm.id==='authForm'){ev.preventDefault();submitAuth(fm);return;}
  if(fm.id==='joinForm'){ev.preventDefault();fm.setAttribute('data-mode','join');submitAuth(fm);return;}
  if(fm.id==='editCigarForm'){ev.preventDefault();saveCigarEdit(fm.getAttribute('data-id'));return;}
  if(fm.id!=='addForm')return; ev.preventDefault();
  var nf=readCigarForm('nc'); if(!nf.name){toast('Informe o nome do charuto.');return;}
  var c=Object.assign({id:uid(),order:100+state.cigars.length},nf);
  put('cigars',c); state.addOpen=false; render(); toast('Charuto adicionado ao acervo');
});
document.addEventListener('toggle',function(ev){var d=ev.target;if(d&&d.getAttribute&&d.getAttribute('data-lesson')&&d.open){markLesson(d.getAttribute('data-lesson'));var sp=d.querySelector('summary .faint');if(sp)sp.textContent='lida';}},true);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush();else{if((state.view==='session'&&draft)||ritmo.on)requestWake();if(isMember()){scheduleSync();refreshClub();}}});
/* Posição do carrossel do guia e ponto ativo; chamada no evento scroll e logo depois do render, sem esperar o próximo quadro. */
function syncGcar(t){var c=t.querySelectorAll('.gcard');if(c.length<2)return;
  state.gcarX=t.scrollLeft;var w=c[1].offsetLeft-c[0].offsetLeft,idx=Math.round(t.scrollLeft/w),ds=t.parentNode.querySelectorAll('.gdots i');for(var i=0;i<ds.length;i++)ds[i].className=i===idx?'on':'';}
document.addEventListener('scroll',function(e){var t=e.target;if(!t||!t.classList||!t.classList.contains('gcar'))return;syncGcar(t);},true);
window.addEventListener('online',function(){if(isMember()){refreshClub(true).then(function(){sync();});if(state.tab==='clube')loadFeed();}});
window.addEventListener('offline',function(){if(isMember())setStatus('offline');});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installPrompt=e;if(state.view==='home'&&state.tab==='conta')render();});
window.addEventListener('appinstalled',function(){installPrompt=null;toast('App instalado na tela inicial');});

function init(){
  render();
  openDB().then(function(d){idb=d;return loadAll();}).catch(function(){state.dbError=true;state.loaded=true;}).then(function(){render();cloudInit();});
  try{if(navigator.storage&&navigator.storage.persisted){navigator.storage.persisted().then(function(p){busy.persisted=p;if(!p&&navigator.storage.persist)return navigator.storage.persist().then(function(v){busy.persisted=v;});}).then(function(){if(state.tab==='conta'&&state.view==='home')render();}).catch(function(){});}}catch(e){}
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
  /* Os rótulos da roda são medidos com a fonte do app: mede de novo quando as fontes terminam de carregar. */
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(state.view==='session')rodaFit();});
}
window.__diario={state:state,cloud:cloud,sync:sync,loadFeed:loadFeed};
init();
})();
</script>
</body>
