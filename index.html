<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diário de Degustação</title>
<meta name="theme-color" content="#17110D">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: uma coluna para celular; cartões para charutos, sessões e posts do clube; cabeçalho fixo com cronômetro durante a sessão. Escuro por padrão (uso ao entardecer e à noite). */
:root{
  --bg:#17110D; --surface:#221912; --surface2:#2E231A; --line:#3E2F23;
  --fg:#F2E8D8; --muted:#BBA98F; --faint:#93826B;
  --ember:#E58A42; --ember-ink:#1A120C; --sand:#DDB66B;
  --ok:#86B97F; --warn:#E3B84F; --bad:#E8735D;
  --f-display:'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
  --f-body:'IBM Plex Sans', 'Segoe UI', Roboto, system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F5EFE5; --surface:#FCF8F2; --surface2:#EDE3D3; --line:#DACDB8;
  --fg:#2A1E15; --muted:#6B5945; --faint:#7E6C57;
  --ember:#B4561A; --ember-ink:#FFF8F0; --sand:#8E6A1E;
  --ok:#3D7A37; --warn:#8A650C; --bad:#B03A27; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#F5EFE5; --surface:#FCF8F2; --surface2:#EDE3D3; --line:#DACDB8;
  --fg:#2A1E15; --muted:#6B5945; --faint:#7E6C57;
  --ember:#B4561A; --ember-ink:#FFF8F0; --sand:#8E6A1E;
  --ok:#3D7A37; --warn:#8A650C; --bad:#B03A27; color-scheme:light; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:16px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:calc(40px + env(safe-area-inset-bottom, 0px))}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg)}
img{max-width:100%}
.wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0}
h1{font-size:40px; font-weight:800; line-height:1; letter-spacing:-0.01em}
h2{font-size:24px; font-weight:800}
h3,.h3{font-family:var(--f-display); font-size:19px; font-weight:600; display:block}
p{margin:0}
.eyebrow{font-family:var(--f-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ember)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{opacity:.55; cursor:default}
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{outline:2px solid var(--ember); outline-offset:2px}

header.top{padding-top:28px; display:flex; flex-direction:column; gap:8px}
.mode{font-size:13px; color:var(--faint); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.sdot{width:8px; height:8px; border-radius:50%; background:var(--faint); flex-shrink:0}
.sdot.ok{background:var(--ok)} .sdot.warn{background:var(--warn)} .sdot.bad{background:var(--bad)}

.btn{min-height:44px; padding:10px 18px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface2); font-weight:600; text-decoration:none; color:var(--fg); display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn.primary{background:var(--ember); border-color:var(--ember); color:var(--ember-ink)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad); color:var(--bad); background:transparent}
.btn.small{min-height:36px; padding:6px 12px; font-size:14px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.linkbtn{background:none; border:0; padding:0; color:var(--ember); font-weight:600; text-decoration:underline; text-underline-offset:3px}

.tabs{display:flex; gap:4px; padding:4px; background:var(--surface); border-radius:14px; border:1px solid var(--line); overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto; min-height:42px; border:0; border-radius:10px; background:transparent; font-weight:600; color:var(--muted); font-size:15px; padding:0 10px}
.tabs button[aria-selected="true"]{background:var(--surface2); color:var(--fg)}
.minitabs{display:flex; gap:6px}
.minitabs button{flex:1; min-height:40px; border-radius:10px; border:1.5px solid var(--line); background:transparent; font-weight:600}
.minitabs button[aria-selected="true"]{background:var(--surface2); border-color:var(--ember)}

.stats{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px}
.stat{padding:14px; border-radius:14px; background:var(--surface); display:flex; flex-direction:column; gap:2px; min-width:0}
.stat b{font-family:var(--f-display); font-size:26px; font-weight:800; line-height:1.1; overflow-wrap:anywhere}
.stat span{font-size:13px; color:var(--muted)}

.list{display:flex; flex-direction:column; gap:12px}
.card{padding:16px 18px; border-radius:16px; background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; gap:10px; min-width:0}
.card.live{border-color:var(--ember)}
.card .head{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.card .meta, .meta{font-size:14px; color:var(--muted)}
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; background:var(--surface2); font-size:13px; color:var(--fg); white-space:nowrap}
.chip.st-cesta{color:var(--sand)} .chip.st-estoque{color:var(--ok)} .chip.st-hist{color:var(--muted)}
.tags{display:flex; flex-wrap:wrap; gap:6px}
.meter{display:flex; gap:3px} .meter i{width:16px; height:7px; border-radius:2px; background:var(--line)} .meter i.on{background:var(--ember)}
.score{font-family:var(--f-display); font-weight:800; font-size:30px; line-height:1; color:var(--ember)}
.empty{padding:22px; border-radius:16px; border:1.5px dashed var(--line); color:var(--muted); display:flex; flex-direction:column; gap:10px}
.banner{padding:14px 16px; border-radius:14px; border:1.5px solid var(--warn); display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap}

/* clube */
.phead{display:flex; gap:12px; align-items:center}
.phead .who{flex:1; min-width:0}
.phead b{font-weight:600}
.avatar{width:40px; height:40px; border-radius:50%; background:var(--surface2); color:var(--ember); display:inline-flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:800; font-size:18px; flex-shrink:0; border:1.5px solid var(--line)}
.avatar.sm{width:30px; height:30px; font-size:14px}
.plink{background:none; border:0; padding:0; text-align:left; color:var(--fg)}
.like[aria-pressed="true"]{border-color:var(--ember); color:var(--ember)}
.like[aria-pressed="true"] svg{fill:var(--ember)}
.comments{display:flex; flex-direction:column; gap:12px}
.cmt{display:flex; gap:10px; align-items:flex-start}
.cmt .body{flex:1; min-width:0; background:var(--surface); border-radius:12px; padding:10px 12px}
.cmt .body p{overflow-wrap:anywhere; white-space:pre-wrap}
.badge{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}

/* sessão */
.sbar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); padding-block:12px 10px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px}
.sbar .who{flex:1; min-width:0}
.sbar .who h2{font-size:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tline{flex-basis:100%; display:flex; align-items:center; gap:10px}
.tline .btn{margin-left:auto}
.timer{display:flex; align-items:center; gap:8px}
.timer .clock, .clock{font-family:var(--f-mono); font-size:22px; font-variant-numeric:tabular-nums}
.ring{width:36px; height:36px; flex-shrink:0}
.ring circle{fill:none; stroke-width:4}
.ring .track{stroke:var(--line)} .ring .prog{stroke:var(--ember); stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%}
.ritmo{font-size:12px; color:var(--faint)}
fieldset{border:0; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; min-width:0}
legend{font-weight:600; font-size:15px; padding:0; margin-bottom:10px}
.opts{display:flex; flex-wrap:wrap; gap:8px}
.opt{min-height:40px; padding:7px 13px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font-size:15px; display:inline-flex; align-items:center; gap:7px}
.opt[aria-pressed="true"]{background:var(--ember); border-color:var(--ember); color:var(--ember-ink); font-weight:600}
.dot{width:10px; height:10px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.fam{display:flex; flex-direction:column; gap:6px}
.fam .lbl{font-size:12px; font-family:var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.seg{display:flex; gap:6px}
.seg button{flex:1; min-height:44px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); font-family:var(--f-mono); font-size:16px}
.seg button[aria-pressed="true"]{background:var(--ember); border-color:var(--ember); color:var(--ember-ink)}
.scale{display:flex; justify-content:space-between; font-size:12px; color:var(--faint)}
textarea, input[type=text], input[type=email], input[type=password], input[type=number], select{width:100%; min-height:44px; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); color:var(--fg); font:inherit}
textarea{min-height:84px; resize:vertical}
label.f{display:flex; flex-direction:column; gap:6px; font-size:14px; color:var(--muted)}
label.check{display:flex; gap:10px; align-items:flex-start; font-size:15px; color:var(--fg)}
label.check input{width:22px; height:22px; margin:1px 0 0; accent-color:var(--ember); flex-shrink:0}
input[type=range]{width:100%; accent-color:var(--ember); min-height:44px}
.rating{display:flex; align-items:baseline; gap:6px}
.rating b{font-family:var(--f-display); font-size:44px; font-weight:800; color:var(--ember); line-height:1}
.panel{padding:16px 18px; border-radius:14px; background:var(--surface); display:flex; flex-direction:column; gap:18px}
.alert{padding:14px 16px; border-radius:12px; border:1.5px solid var(--warn); color:var(--fg); display:flex; flex-direction:column; gap:4px; font-size:15px}
.alert b{color:var(--warn)}
.alert.err{border-color:var(--bad)} .alert.err b{color:var(--bad)}
.hint{font-size:14px; color:var(--muted); padding:12px 14px; border-radius:12px; background:var(--surface2)}
details.terms{font-size:14px; color:var(--muted)}
details.terms summary{cursor:pointer; color:var(--fg); font-weight:600}
details.terms div{display:flex; flex-direction:column; gap:8px; padding-top:10px}

/* fotos da anilha */
.band{display:block; width:100%; max-width:100%; aspect-ratio:16/10; object-fit:contain; background:var(--surface2); border-radius:12px; border:1px solid var(--line)}
.band.thumb{width:84px; aspect-ratio:4/3; object-fit:cover; flex-shrink:0; border-radius:10px}
.band.cmpimg{aspect-ratio:4/3; object-fit:cover}
.bandslot{display:flex; flex-direction:column; gap:10px}
.filebtn{position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:8px}
.filebtn input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; margin:0}
.filebtn:focus-within{outline:2px solid var(--ember); outline-offset:2px}
.withthumb{display:flex; gap:12px; min-width:0; align-items:flex-start}
.durrow{display:grid; grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto; gap:10px; align-items:end}
.durrow input{text-align:center; font-family:var(--f-mono); font-size:18px}

/* detalhe */
.profile{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px}
.third{padding:14px 12px; border-radius:14px; background:var(--surface); display:flex; flex-direction:column; gap:10px; min-width:0}
.bar{height:80px; display:flex; align-items:flex-end; border-bottom:1.5px solid var(--line)}
.bar i{display:block; width:100%; border-radius:6px 6px 0 0; background:var(--ember)}
.third .tags .chip{font-size:12px; padding:2px 8px}
.facts{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.fact{padding:12px 14px; border-radius:12px; background:var(--surface); min-width:0}
.fact span{display:block; font-size:12px; color:var(--faint); font-family:var(--f-mono); letter-spacing:.08em; text-transform:uppercase}
.fact b{font-weight:600; overflow-wrap:anywhere}
.cmp{overflow-x:auto}
.cmp table{width:100%; border-collapse:collapse; font-size:14px; min-width:420px}
.cmp th, .cmp td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top}
.cmp th{color:var(--faint); font-weight:500; width:28%}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:15px}
.kv dt{color:var(--faint)} .kv dd{margin:0; font-weight:600; overflow-wrap:anywhere}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:600; z-index:20; max-width:calc(100% - 32px)}
@media (max-width:420px){ h1{font-size:34px} .stat b{font-size:21px} .timer .clock{font-size:18px} .facts{grid-template-columns:1fr} .tabs button{font-size:14px; padding:0 8px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite">
  <header class="top">
    <div class="eyebrow">Charutos · paladar e sensações</div>
    <h1>Diário de Degustação</h1>
    <p class="mode">Carregando seus registros…</p>
  </header>
</div>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script>
(function(){
'use strict';
var APP_ID='diario-degustacao', BACKUP_VERSION=1;
var FAMILIES=[
  {id:'doce',label:'Doce',color:'#E6C68C',notes:['Doce','Mel','Baunilha','Creme','Caramelo']},
  {id:'castanha',label:'Castanhas',color:'#C99A62',notes:['Castanha','Amêndoa','Amendoim']},
  {id:'madeira',label:'Madeira',color:'#A6713F',notes:['Cedro','Carvalho','Tostado']},
  {id:'terra',label:'Terra',color:'#7F6B4F',notes:['Terroso','Couro','Feno']},
  {id:'cacau',label:'Cacau e café',color:'#6A4330',notes:['Cacau','Café','Chocolate amargo']},
  {id:'especiaria',label:'Especiarias',color:'#CF6339',notes:['Pimenta','Canela','Cravo']},
  {id:'fruta',label:'Fruta e flor',color:'#B9A646',notes:['Frutas secas','Cítrico','Floral']}
];
var NOTE_COLOR={}; FAMILIES.forEach(function(f){f.notes.forEach(function(n){NOTE_COLOR[n]=f.color;});});
var MOMENTS=['Pós-almoço','Entardecer','Fim de noite'];
var DRINKS=['Café','Água de coco','Caipirinha','Whisky','Rum','Cachaça envelhecida','Água','Outra'];
var STATUS={cesta:['Na cesta','st-cesta'],estoque:['Em estoque','st-estoque'],historico:['Histórico','st-hist']};
var CAMERA_ICON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>';
var GALLERY_ICON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M20.5 16l-5-5-8 8.5"></path></svg>';
var HEART_ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>';
var CHAT_ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>';
var TERMS_HTML='<p>O Clube é um grupo privado, por convite, para maiores de 18 anos registrarem e compartilharem degustações de charutos.</p>'+
  '<p>Para o app funcionar guardamos no Supabase: seu nome de exibição, e-mail, senha (criptografada pelo Supabase), sessões, curtidas, comentários e fotos de anilhas. Sessões marcadas como "Só eu" não aparecem para outros membros.</p>'+
  '<p>Não é permitido anunciar, vender, divulgar preços, lojas ou links de compra de produtos de tabaco.</p>'+
  '<p>Você pode excluir sua conta e todos os seus dados do clube a qualquer momento em Conta › Excluir minha conta. O diário guardado no seu celular continua com você.</p>'+
  '<p>Dúvidas ou pedidos sobre seus dados: fale com o administrador do clube.</p>';

var state={cigars:[],sessions:[],view:'home',tab:'acervo',detailId:null,postUid:null,step:0,cmpA:'',cmpB:'',confirmDelete:false,addOpen:false,loaded:false,dbError:false,confirm:''};
var draft=null, saveTimer=null, tick=null, wakeLock=null, installPrompt=null;
var photoURL={}, busy={uploading:false,importing:false,persisted:null};

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){try{return crypto.randomUUID().replace(/-/g,'').slice(0,20);}catch(e){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}}
function clone(o){return JSON.parse(JSON.stringify(o));}
function toast(msg){var t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true;},3000);}
function fmtDate(iso){try{return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return '';}}
function fmtDateTime(iso){try{return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function relTime(iso){var t=Date.parse(iso);if(!t)return '';var d=(Date.now()-t)/1000;if(d<60)return 'agora';if(d<3600)return 'há '+Math.floor(d/60)+' min';if(d<86400)return 'há '+Math.floor(d/3600)+' h';if(d<172800)return 'ontem';return fmtDate(iso);}
function fmtClock(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;function p(n){return (n<10?'0':'')+n;}return (h?h+':'+p(m):p(m))+':'+p(ss);}
function elapsed(s){if(!s||!s.timer)return 0;var t=s.timer;return (t.acc||0)+(t.running&&t.resumedAt?Date.now()-t.resumedAt:0);}
function cigarById(id){for(var i=0;i<state.cigars.length;i++)if(state.cigars[i].id===id)return state.cigars[i];return null;}
function sessionById(id){for(var i=0;i<state.sessions.length;i++)if(state.sessions[i].id===id)return state.sessions[i];return null;}
function done(){return state.sessions.filter(function(s){return s.status==='concluida';});}
function openSession(){for(var i=0;i<state.sessions.length;i++)if(state.sessions[i].status==='aberta')return state.sessions[i];return null;}
function meter(n){var h='<span class="meter" role="img" aria-label="Força '+(n||0)+' de 5">';for(var i=1;i<=5;i++)h+='<i class="'+(i<=n?'on':'')+'"></i>';return h+'</span>';}
function strengthLabel(n){return ['—','Suave','Suave-médio','Médio','Médio-encorpado','Encorpado'][n||0]||'—';}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null){localStorage.removeItem(k);return null;}localStorage.setItem(k,v);}catch(e){return null;}}
function bandImg(id,cls,alt){var u=photoURL[id];if(!u)return '';return '<img class="band '+(cls||'')+'" src="'+u+'" alt="'+esc(alt||'Foto da anilha')+'">';}
function bandOfCigar(cid){for(var i=0;i<state.sessions.length;i++){var s=state.sessions[i];if(s.cigarId===cid&&s.bandId&&photoURL[s.bandId])return s.bandId;}var c=cigarById(cid);return (c&&c.bandId&&photoURL[c.bandId])?c.bandId:null;}
function numStr(n){return String(n).replace('.',',');}

function topNotes(thirds,max){var c={};(thirds||[]).forEach(function(t){(t&&t.notes||[]).forEach(function(n){c[n]=(c[n]||0)+1;});});return Object.keys(c).sort(function(a,b){return c[b]-c[a];}).slice(0,max||5);}

/* ---------- armazenamento local (IndexedDB) ---------- */
var idb=null;
function openDB(){return new Promise(function(res,rej){if(!window.indexedDB){rej(new Error('sem IndexedDB'));return;}var r=indexedDB.open(APP_ID,2);
  r.onupgradeneeded=function(){var d=r.result;['cigars','sessions','photos','tombstones'].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});});};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.onblocked=function(){rej(new Error('bloqueado'));};});}
function tx(store,mode,fn){return new Promise(function(res,rej){if(!idb){res(undefined);return;}var t,out;try{t=idb.transaction(store,mode);}catch(e){rej(e);return;}var rq=fn(t.objectStore(store));if(rq)rq.onsuccess=function(){out=rq.result;};
  t.oncomplete=function(){res(out);};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error||new Error('abortado'));};});}
function getAll(n){return tx(n,'readonly',function(s){return s.getAll();}).then(function(r){return r||[];});}
function getRec(n,id){return tx(n,'readonly',function(s){return s.get(id);});}
function putRec(n,o){return tx(n,'readwrite',function(s){return s.put(o);});}
function delRec(n,id){return tx(n,'readwrite',function(s){return s.delete(id);});}
function clearStore(n){return tx(n,'readwrite',function(s){return s.clear();});}
function saveErr(e){var q=e&&(e.name==='QuotaExceededError');toast(q?'Sem espaço no celular para salvar. Libere espaço ou remova fotos antigas.':'Não foi possível salvar. Tente de novo.');}

function sortAll(){state.cigars.sort(function(a,b){return (a.order||999)-(b.order||999)||String(a.name).localeCompare(b.name);});state.sessions.sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt));});}
function upsertState(col,obj){var arr=col==='cigars'?state.cigars:state.sessions;var i=arr.findIndex(function(x){return x.id===obj.id;});if(i>=0)arr[i]=clone(obj);else arr.push(clone(obj));sortAll();}
function put(col,obj){obj.updatedAt=Date.now();upsertState(col,obj);ls('diario-dirty',String(Date.now()));scheduleSync();return putRec(col,clone(obj)).catch(saveErr);}
function removeSession(id){var s=sessionById(id);state.sessions=state.sessions.filter(function(x){return x.id!==id;});ls('diario-dirty',String(Date.now()));
  return Promise.all([delRec('sessions',id),putRec('tombstones',{id:'sessions:'+id,col:'sessions',localId:id,photo:s&&s.bandId||null})]).then(scheduleSync).catch(saveErr);}
function removePhoto(id){if(!id)return;if(photoURL[id]){try{URL.revokeObjectURL(photoURL[id]);}catch(e){}delete photoURL[id];}
  getRec('photos',id).then(function(p){if(p&&p.remote)putRec('tombstones',{id:'photo:'+id,col:'photo',photo:id}).then(scheduleSync);return delRec('photos',id);}).catch(function(){});}
function addPhoto(blob){var id=uid();return putRec('photos',{id:id,blob:blob,type:blob.type||'image/jpeg',createdAt:new Date().toISOString()}).then(function(){photoURL[id]=URL.createObjectURL(blob);scheduleSync();return id;});}

function loadAll(){return Promise.all([getAll('cigars'),getAll('sessions'),getAll('photos')]).then(function(r){
  state.cigars=r[0];state.sessions=r[1];
  var keep={};r[2].forEach(function(p){keep[p.id]=1;});
  Object.keys(photoURL).forEach(function(k){if(!keep[k]){try{URL.revokeObjectURL(photoURL[k]);}catch(e){}delete photoURL[k];}});
  r[2].forEach(function(p){if(p.blob&&!photoURL[p.id])photoURL[p.id]=URL.createObjectURL(p.blob);});
  sortAll();state.loaded=true;});}

function isMember(){return !!(cloud.sb&&cloud.user&&cloud.profile&&cloud.profile.id===cloud.user.id);}
function isDirty(r){return !r.syncedAt||(r.updatedAt||0)>r.syncedAt;}
function rerender(){if(state.view==='session')return;clearTimeout(renderTimer);renderTimer=setTimeout(render,30);}
function setStatus(s,detail){cloud.status=s;cloud.statusDetail=detail||'';rerender();}
function scheduleSync(){if(!cloud.configured)return;clearTimeout(syncTimer);syncTimer=setTimeout(sync,2500);}
function canSync(){return isMember()&&!cloud.ownerMismatch&&!!idb&&navigator.onLine!==false;}
function authErr(e){var m=String(e&&(e.message||e.error_description||e)||'');
  if(/invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';
  if(/already registered|already been registered|user_already_exists/i.test(m))return 'Este e-mail já tem conta. Use "Entrar".';
  if(/password should be at least|weak_password/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/invalid_invite/i.test(m))return 'Convite inválido ou esgotado. Peça um novo link ao administrador do clube.';
  if(/must_be_adult/i.test(m))return 'O clube é exclusivo para maiores de 18 anos.';
  if(/terms_required/i.test(m))return 'É preciso aceitar as regras do clube.';
  if(/email.*invalid|invalid.*email/i.test(m))return 'E-mail inválido.';
  if(/not_admin/i.test(m))return 'Só o administrador pode gerar convites.';
  if(/fetch|network|failed to/i.test(m))return 'Sem conexão com o clube. Verifique a internet.';
  if(/rate limit|too many/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos.';
  return 'Erro: '+m;}

function cloudInit(){
  if(!cloud.configured)return;
  try{cloud.sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});}catch(e){cloud.configured=false;return;}
  /* O callback roda dentro da trava de autenticação do supabase-js: adiar qualquer chamada ao banco evita travamento. */
  cloud.sb.auth.onAuthStateChange(function(evt,session){var u=session?session.user:null;
    if((u&&u.id)!==(cloud.user&&cloud.user.id)){cloud.user=u;setTimeout(function(){if(cloud.user)afterLogin();else{cloud._loginFor=null;cloud.profileChecked=true;rerender();}},0);}});
  cloud.sb.auth.getSession().then(function(r){var s=r&&r.data&&r.data.session;cloud.user=s?s.user:null;if(cloud.user)afterLogin();else{cloud.profileChecked=true;cloud.profile=null;rerender();}})
    .catch(function(){cloud.profileChecked=true;rerender();});
}
function afterLogin(){
  var u=cloud.user;if(!u||cloud._loginFor===u.id)return Promise.resolve();cloud._loginFor=u.id;
  return loadProfile().then(function(){if(isMember()){checkOwner();sync();loadFeed();}rerender();});
}
function loadProfile(){
  var seq=cloud._profSeq=(cloud._profSeq||0)+1;
  return cloud.sb.from('profiles').select('id,display_name,is_admin').eq('id',cloud.user.id).maybeSingle().then(function(r){
    if(seq!==cloud._profSeq)return;
    if(r.error)throw r.error;cloud.profile=r.data||null;cloud.profileChecked=true;
    if(cloud.profile)ls('clube-profile',JSON.stringify(cloud.profile));else ls('clube-profile',null);
  }).catch(function(){if(seq!==cloud._profSeq)return;var c=null;try{c=JSON.parse(ls('clube-profile')||'null');}catch(e){}cloud.profile=(c&&c.id===cloud.user.id)?c:null;cloud.profileChecked=true;});
}
function checkOwner(){var owner=ls('clube-owner');cloud.ownerMismatch=!!(owner&&owner!==cloud.user.id&&(state.sessions.length||state.cigars.length));}

function nz(v){return (v===''||v===undefined)?null:v;}

/* ---- sincronização (o celular é a fonte; a nuvem é cópia e vitrine do clube) ---- */
function sync(){
  if(!canSync()){if(isMember()&&navigator.onLine===false)setStatus('offline');return Promise.resolve();}
  if(syncing){syncAgain=true;return Promise.resolve();}
  syncing=true;setStatus('syncing');
  var sb=cloud.sb,u=cloud.user.id;
  return (async function(){
    ls('clube-owner',u);
    var refs={};state.sessions.forEach(function(s){if(s.bandId)refs[s.bandId]=1;});state.cigars.forEach(function(c){if(c.bandId)refs[c.bandId]=1;});
    var photos=await getAll('photos');
    for(var i=0;i<photos.length;i++){var p=photos[i];if(p.foreign||p.remote||!refs[p.id])continue;
      var up=await sb.storage.from('bands').upload(u+'/'+p.id+'.jpg',p.blob,{upsert:true,contentType:p.type||'image/jpeg'});
      if(up.error)throw up.error;p.remote=true;await putRec('photos',p);}
    var tombs=await getAll('tombstones');
    for(var j=0;j<tombs.length;j++){var t=tombs[j];
      if(t.col==='photo'){await sb.storage.from('bands').remove([u+'/'+t.photo+'.jpg']);}
      else{var d=await sb.from(t.col).delete().eq('owner_id',u).eq('local_id',t.localId);if(d.error)throw d.error;
        if(t.photo)await sb.storage.from('bands').remove([u+'/'+t.photo+'.jpg']);}
      await delRec('tombstones',t.id);}
    var dc=state.cigars.filter(isDirty),ds=state.sessions.filter(isDirty);
    if(dc.length){var rc=await sb.from('cigars').upsert(dc.map(function(c){return cigarRow(c,u);}),{onConflict:'owner_id,local_id'});if(rc.error)throw rc.error;}
    if(ds.length){var rs=await sb.from('sessions').upsert(ds.map(function(s){return sessionRow(s,u);}),{onConflict:'owner_id,local_id'});if(rs.error)throw rs.error;}
    for(var a=0;a<dc.length;a++){var cur=await getRec('cigars',dc[a].id);if(cur&&cur.updatedAt===dc[a].updatedAt){cur.syncedAt=stamp(cur);await putRec('cigars',cur);}}
    for(var b=0;b<ds.length;b++){var cs=await getRec('sessions',ds[b].id);if(cs&&cs.updatedAt===ds[b].updatedAt){cs.syncedAt=stamp(cs);await putRec('sessions',cs);}}
    await loadAll();
    var pc=await sb.from('cigars').select('*').eq('owner_id',u);if(pc.error)throw pc.error;
    var ps=await sb.from('sessions').select('*').eq('owner_id',u);if(ps.error)throw ps.error;
    await mergeRemote('cigars',pc.data||[],rowToCigar);
    await mergeRemote('sessions',ps.data||[],rowToSession);
    await loadAll();
    var need=[];state.sessions.concat(state.cigars).forEach(function(r){if(r.bandId&&!photoURL[r.bandId]&&need.indexOf(r.bandId)<0)need.push(r.bandId);});
    for(var k=0;k<need.length;k++){var dl=await sb.storage.from('bands').download(u+'/'+need[k]+'.jpg');
      if(!dl.error&&dl.data){await putRec('photos',{id:need[k],blob:dl.data,type:dl.data.type||'image/jpeg',remote:true,createdAt:new Date().toISOString()});}}
    if(need.length)await loadAll();
    cloud.lastSync=Date.now();ls('clube-last-sync',String(cloud.lastSync));
  })().then(function(){syncing=false;setStatus('ok');if(syncAgain){syncAgain=false;scheduleSync();}if(state.tab==='clube')loadFeed();})
    .catch(function(e){syncing=false;setStatus(navigator.onLine===false?'offline':'error',authErr(e));});
}
async function mergeRemote(col,rows,conv){
  var local={};(col==='cigars'?state.cigars:state.sessions).forEach(function(r){local[r.id]=r;});
  var seen={};
  for(var i=0;i<rows.length;i++){var r=conv(rows[i]);seen[r.id]=1;var l=local[r.id];
    if(draft&&draft.id===r.id)continue;
    if(!l||(!isDirty(l)&&(r.updatedAt||0)>(l.updatedAt||0)))await putRec(col,r);}
  if(rows.length<1000){var ids=Object.keys(local);for(var j=0;j<ids.length;j++){var x=local[ids[j]];
    if(!seen[x.id]&&x.syncedAt&&!isDirty(x)&&!(draft&&draft.id===x.id))await delRec(col,x.id);}}
}
function resetSyncFlags(){return Promise.all([getAll('cigars'),getAll('sessions'),getAll('photos')]).then(function(r){
  var ops=[];r[0].forEach(function(c){delete c.syncedAt;ops.push(putRec('cigars',c));});r[1].forEach(function(s){delete s.syncedAt;ops.push(putRec('sessions',s));});
  r[2].forEach(function(p){if(!p.foreign){delete p.remote;ops.push(putRec('photos',p));}});return Promise.all(ops).then(function(){return clearStore('tombstones');});}).then(loadAll);}

/* ---- feed ---- */
var FEED_COLS='uid,owner_id,local_id,cigar_name,started_at,ended_at,moment,drink,thirds,strength,rating,rebuy,comment,duration_min,band_photo,burn,draw,feel,profiles(display_name)';
function loadFeed(){
  if(!isMember()||cloud.feedLoading)return Promise.resolve();
  cloud.feedLoading=true;rerender();var sb=cloud.sb;
  return (async function(){
    var r=await sb.from('sessions').select(FEED_COLS).eq('visibility','club').eq('status','concluida').order('ended_at',{ascending:false}).limit(60);
    if(r.error)throw r.error;var items=r.data||[],ids=items.map(function(x){return x.uid;}),likes={},comments={};
    if(ids.length){
      var rr=await sb.from('reactions').select('session_uid,user_id').in('session_uid',ids);if(rr.error)throw rr.error;
      (rr.data||[]).forEach(function(x){(likes[x.session_uid]=likes[x.session_uid]||[]).push(x.user_id);});
      var rc=await sb.from('comments').select('id,session_uid,user_id,body,created_at,profiles(display_name)').in('session_uid',ids).order('created_at',{ascending:true});if(rc.error)throw rc.error;
      (rc.data||[]).forEach(function(x){(comments[x.session_uid]=comments[x.session_uid]||[]).push(x);});}
    cloud.feed=items;cloud.likes=likes;cloud.comments=comments;cloud.feedAt=Date.now();cloud.feedError='';
    ls('clube-feed',JSON.stringify({items:items,likes:likes,comments:comments,at:cloud.feedAt}));
  })().then(function(){cloud.feedLoading=false;rerender();fetchFeedPhotos();})
    .catch(function(e){cloud.feedLoading=false;cloud.feedError=navigator.onLine===false?'Sem internet. Mostrando o último feed carregado.':authErr(e);rerender();});
}
function feedPhotoKey(it){if(!it.band_photo)return null;if(cloud.user&&it.owner_id===cloud.user.id&&photoURL[it.band_photo])return it.band_photo;return 'r:'+it.owner_id+'/'+it.band_photo;}
function fetchFeedPhotos(){
  if(!isMember())return;
  cloud.photoFail=cloud.photoFail||{};
  cloud.feed.forEach(function(it){var key=feedPhotoKey(it);if(!key||photoURL[key]||cloud.photoReq[key]||(Date.now()-(cloud.photoFail[key]||0)<60000))return;cloud.photoReq[key]=1;
    getRec('photos',key).then(function(p){if(p&&p.blob){photoURL[key]=URL.createObjectURL(p.blob);rerender();return;}
      return cloud.sb.storage.from('bands').download(it.owner_id+'/'+it.band_photo+'.jpg').then(function(dl){if(dl.error||!dl.data){cloud.photoFail[key]=Date.now();return;}
        photoURL[key]=URL.createObjectURL(dl.data);rerender();return putRec('photos',{id:key,blob:dl.data,type:dl.data.type,foreign:true,remote:true,createdAt:new Date().toISOString()});});
    }).catch(function(){}).then(function(){delete cloud.photoReq[key];});});
}
function feedItem(u){for(var i=0;i<cloud.feed.length;i++)if(cloud.feed[i].uid===u)return cloud.feed[i];return null;}
function toggleLike(su){
  if(!isMember())return;var me=cloud.user.id,arr=cloud.likes[su]||(cloud.likes[su]=[]),i=arr.indexOf(me);
  if(i>=0){arr.splice(i,1);rerender();cloud.sb.from('reactions').delete().eq('session_uid',su).eq('user_id',me).then(function(r){if(r.error){arr.push(me);toast(authErr(r.error));rerender();}});}
  else{arr.push(me);rerender();cloud.sb.from('reactions').insert({session_uid:su,user_id:me}).then(function(r){if(r.error&&!/duplicate/i.test(r.error.message||'')){arr.splice(arr.indexOf(me),1);toast(authErr(r.error));rerender();}});}
}
function addComment(su){
  var el=document.getElementById('c-body');if(!el)return;var body=el.value.trim();if(!body){toast('Escreva um comentário.');return;}if(body.length>500){toast('Máximo de 500 caracteres.');return;}
  cloud.commentBusy=true;render();
  cloud.sb.from('comments').insert({session_uid:su,user_id:cloud.user.id,body:body}).select('id,session_uid,user_id,body,created_at,profiles(display_name)').single().then(function(r){
    cloud.commentBusy=false;if(r.error){toast(authErr(r.error));render();var e2=document.getElementById('c-body');if(e2)e2.value=body;return;}
    (cloud.comments[su]=cloud.comments[su]||[]).push(r.data);render();toast('Comentário publicado');});
}
function deleteComment(cid,su){
  cloud.sb.from('comments').delete().eq('id',cid).then(function(r){if(r.error){toast(authErr(r.error));return;}
    cloud.comments[su]=(cloud.comments[su]||[]).filter(function(c){return c.id!==cid;});render();toast('Comentário apagado');});
}

/* ---- conta ---- */
async function submitAuth(form){
  var mode=form.getAttribute('data-mode'),sb=cloud.sb;
  var email=(document.getElementById('au-email')||{}).value||'',pass=(document.getElementById('au-pass')||{}).value||'';
  var name=((document.getElementById('au-name')||{}).value||'').trim(),code=((document.getElementById('au-code')||{}).value||'').trim().toUpperCase();
  var adult=!!(document.getElementById('au-adult')||{}).checked,terms=!!(document.getElementById('au-terms')||{}).checked;
  cloud.form={name:name,email:email,pass:pass,code:code,adult:adult,terms:terms};
  cloud.authMsg='';
  if(mode!=='entrar'){if(!name){cloud.authMsg='Informe seu nome de exibição.';render();return;}if(!code){cloud.authMsg='Informe o código do convite.';render();return;}
    if(!adult){cloud.authMsg='O clube é exclusivo para maiores de 18 anos.';render();return;}if(!terms){cloud.authMsg='É preciso aceitar as regras do clube.';render();return;}}
  cloud.authBusy=true;render();
  try{
    if(mode==='entrar'){var r=await sb.auth.signInWithPassword({email:email.trim(),password:pass});if(r.error)throw r.error;cloud.user=r.data.user;}
    else if(mode==='criar'){
      var s=await sb.auth.signUp({email:email.trim(),password:pass,options:{data:{display_name:name}}});if(s.error)throw s.error;
      if(!s.data.session){cloud.authBusy=false;cloud.authMsg='Conta criada, mas o clube está exigindo confirmação por e-mail. Avise o administrador: é preciso desligar "Confirm email" no Supabase.';render();return;}
      cloud.user=s.data.user;}

/* ---------- backup ---------- */
function blobToDataURL(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(r.error);};r.readAsDataURL(b);});}
function buildBackup(){return getAll('photos').then(function(ps){ps=ps.filter(function(p){return !p.foreign;});return Promise.all(ps.map(function(p){return blobToDataURL(p.blob).then(function(d){return {id:p.id,createdAt:p.createdAt,dataUrl:d};});}));}).then(function(photos){
  function strip(r){var c=clone(r);delete c.syncedAt;return c;}
  return {app:APP_ID,version:BACKUP_VERSION,exportedAt:new Date().toISOString(),cigars:state.cigars.map(strip),sessions:state.sessions.map(strip),photos:photos};});}
function backupFile(){return buildBackup().then(function(b){var name='diario-degustacao-'+new Date().toISOString().slice(0,10)+'.json';var blob=new Blob([JSON.stringify(b)],{type:'application/json'});var file=null;try{file=new File([blob],name,{type:'application/json'});}catch(e){}return {blob:blob,file:file,name:name};});}
function markBackup(){ls('diario-last-backup',String(Date.now()));}
function exportDownload(){backupFile().then(function(f){var a=document.createElement('a');a.href=URL.createObjectURL(f.blob);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},4000);markBackup();render();toast('Backup salvo em Downloads');}).catch(function(){toast('Não foi possível gerar o backup.');});}
function exportShare(){backupFile().then(function(f){if(!(f.file&&navigator.canShare&&navigator.canShare({files:[f.file]}))){toast('Compartilhamento indisponível. Use "Salvar backup".');return;}
  return navigator.share({files:[f.file],title:'Backup do Diário de Degustação'}).then(function(){markBackup();render();toast('Backup compartilhado');});}).catch(function(e){if(e&&e.name==='AbortError')return;toast('Não foi possível compartilhar o backup.');});}
function dataURLToBlob(d){return fetch(d).then(function(r){return r.blob();});}
function importFile(file){
  if(!file)return;busy.importing=true;render();
  file.text().then(function(txt){var b=JSON.parse(txt);if(!b||b.app!==APP_ID)throw new Error('formato');
    var cs=Array.isArray(b.cigars)?b.cigars:[],ss=Array.isArray(b.sessions)?b.sessions:[],ps=Array.isArray(b.photos)?b.photos:[];
    var chain=Promise.resolve(),nP=0,now=Date.now();
    cs.forEach(function(c){if(c&&c.id){delete c.syncedAt;c.updatedAt=now;chain=chain.then(function(){return putRec('cigars',c);});}});
    ss.forEach(function(s){if(s&&s.id){delete s.syncedAt;s.updatedAt=now;chain=chain.then(function(){return putRec('sessions',s);});}});
    ps.forEach(function(p){if(p&&p.id&&typeof p.dataUrl==='string'&&p.dataUrl.indexOf('data:image/')===0)chain=chain.then(function(){return dataURLToBlob(p.dataUrl).then(function(bl){nP++;return putRec('photos',{id:p.id,blob:bl,type:bl.type,createdAt:p.createdAt||new Date().toISOString()});});});});
    return chain.then(loadAll).then(function(){busy.importing=false;state.tab='acervo';render();scheduleSync();toast('Importados: '+cs.length+' charutos, '+ss.length+' sessões, '+nP+' fotos');});
  }).catch(function(e){busy.importing=false;render();toast(e&&e.message==='formato'?'Este arquivo não é um backup do Diário de Degustação.':'Não foi possível ler o arquivo de backup.');});
}
function needsBackup(){var dirty=Number(ls('diario-dirty')||0),last=Number(ls('diario-last-backup')||0);return state.sessions.length>0&&dirty>last&&!isMember();}

function render(){
  var app=document.getElementById('app');
  if(state.view==='session'&&draft){app.innerHTML=viewSession();startTick();return;}
  stopTick();
  if(state.view==='detail'){app.innerHTML=viewDetail();return;}
  if(state.view==='post'){app.innerHTML=viewPost();return;}
  app.innerHTML=viewHome();

function statusLine(){
  if(state.dbError)return '<span class="sdot bad"></span>Este navegador bloqueou o armazenamento. Abra pelo Chrome, fora da aba anônima.';
  if(!state.loaded)return 'Carregando seus registros…';
  if(!cloud.configured)return '<span class="sdot"></span>Registros salvos neste celular.';
  if(!isMember())return '<span class="sdot"></span>Registros neste celular. Entre no clube na aba Conta para sincronizar.';
  if(cloud.ownerMismatch)return '<span class="sdot bad"></span>Sincronização pausada: os registros deste aparelho são de outra conta.';
  var s=cloud.status;
  if(s==='syncing')return '<span class="sdot warn"></span>Sincronizando com o clube…';
  if(s==='offline')return '<span class="sdot warn"></span>Sem internet. Tudo fica salvo no celular e sobe quando voltar o sinal.';

  return {id:uid(),cigarId:c.id,cigarName:c.name,status:'aberta',visibility:'club',createdAt:new Date().toISOString(),moment:'',drink:'',
    thirds:[{notes:[],intensity:0,text:''},{notes:[],intensity:0,text:''},{notes:[],intensity:0,text:''}],
    strength:0,burn:'',draw:'',feel:'',rating:null,rebuy:'',comment:'',timer:{acc:0,running:true,resumedAt:Date.now()},durationMin:0};
}
function enterSession(s){draft=clone(s);if(!draft.thirds)draft.thirds=newSession({}).thirds;if(!draft.visibility)draft.visibility='club';state.view='session';state.step=0;render();window.scrollTo(0,0);requestWake();}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);}
function flush(){clearTimeout(saveTimer);if(!draft)return Promise.resolve();return put('sessions',draft);}
function leaveSession(){flush();draft=null;releaseWake();state.view='home';state.tab='acervo';render();window.scrollTo(0,0);}
function startTick(){stopTick();tick=setInterval(updateClock,1000);updateClock();}
function stopTick(){if(tick){clearInterval(tick);tick=null;}}
function updateClock(){if(!draft||draft.status==='concluida')return;var ms=elapsed(draft),c=document.getElementById('clock'),r=document.getElementById('ring');if(c)c.textContent=fmtClock(ms);if(r)r.setAttribute('stroke-dashoffset',String(100.53*(1-((ms/1000)%60)/60)));}
function requestWake(){try{if(navigator.wakeLock&&navigator.wakeLock.request){navigator.wakeLock.request('screen').then(function(l){wakeLock=l;}).catch(function(){});}}catch(e){}}
function releaseWake(){try{if(wakeLock)wakeLock.release();}catch(e){}wakeLock=null;}
function compress(file){return new Promise(function(res){var url;try{url=URL.createObjectURL(file);}catch(e){res(file);return;}var img=new Image();
  img.onload=function(){try{var max=1400,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(function(b){res(b||file);},'image/jpeg',0.85);}catch(e){URL.revokeObjectURL(url);res(file);}};
  img.onerror=function(){URL.revokeObjectURL(url);res(null);};img.src=url;});}
function handleBandFile(file){
  if(!file||!draft)return;
  busy.uploading=true;render();
  var sid=draft.id, old=draft.bandId;
  compress(file).then(function(b){if(!b)throw new Error('decode');return addPhoto(b);}).then(function(id){
    busy.uploading=false;
    if(draft&&draft.id===sid){draft.bandId=id;flush();render();}
    if(old&&old!==id)removePhoto(old);
    toast('Foto da anilha salva');
  }).catch(function(e){busy.uploading=false;render();toast(e&&e.message==='decode'?'Não foi possível abrir essa imagem. Tente outra foto.':'Não foi possível salvar a foto. Verifique o espaço do celular.');});
}
function copyText(id,text){
  try{navigator.clipboard.writeText(text).then(function(){toast('Link copiado');},function(){selectInput(id);});}catch(e){selectInput(id);}
}
function selectInput(id){var el=document.getElementById(id);if(el){el.focus();el.select();toast('Selecione e copie o link.');}}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id'),val=b.getAttribute('data-val'),field=b.getAttribute('data-field');
  switch(act){
    case 'tab': state.tab=id; state.view='home'; state.confirm=''; render(); if(id==='clube'&&isMember()&&Date.now()-cloud.feedAt>60000)loadFeed(); break;
    case 'start': {var c=cigarById(id);if(!c)return;if(openSession()){toast('Termine ou retome a sessão em andamento primeiro.');return;}var s=newSession(c);put('sessions',s);enterSession(s);break;}
    case 'resume': case 'edit': {var s2=sessionById(id);if(s2){state.confirmDelete=false;enterSession(s2);}break;}
    case 'home': if(state.view==='session')leaveSession();else{state.view='home';state.confirmDelete=false;render();window.scrollTo(0,0);} break;
    case 'toggle': {var t=draft.timer;if(t.running){t.acc=(t.acc||0)+(Date.now()-t.resumedAt);t.running=false;t.resumedAt=null;}else{t.running=true;t.resumedAt=Date.now();}flush();render();break;}
    case 'step': state.step=Number(id); render(); window.scrollTo(0,0); break;
    case 'set': draft[field]=draft[field]===val?'':val; scheduleSave(); render(); break;
    case 'vis': draft.visibility=val; scheduleSave(); render(); break;
    case 'setnum': {var n=Number(val);if(field==='intensity'){var th=draft.thirds[state.step];th.intensity=th.intensity===n?0:n;}else draft[field]=draft[field]===n?0:n;scheduleSave();render();break;}
    case 'note': {var tt=draft.thirds[state.step],i=tt.notes.indexOf(val);if(i>=0)tt.notes.splice(i,1);else tt.notes.push(val);scheduleSave();render();break;}
    case 'dur': {var nm=setDuration(durMin(draft)+Number(val));var ih=document.getElementById('dur-h'),im=document.getElementById('dur-m');if(ih)ih.value=Math.floor(nm/60);if(im)im.value=nm%60;scheduleSave();break;}
    case 'rmband': {var ob=draft.bandId;draft.bandId=null;flush();removePhoto(ob);render();toast('Foto removida');break;}
    case 'finish': {var tm=draft.timer;if(tm.running){tm.acc=(tm.acc||0)+(Date.now()-tm.resumedAt);tm.running=false;tm.resumedAt=null;}
      var wasDone=draft.status==='concluida';
      draft.status='concluida';if(!wasDone||!draft.endedAt)draft.endedAt=new Date().toISOString();draft.durationMin=Math.max(1,Math.round((tm.acc||0)/60000));
      if(typeof draft.rating!=='number'){var r=document.getElementById('rating');draft.rating=r?Number(r.value):null;}
      var sid=draft.id;flush().then(function(){toast(wasDone?'Alterações salvas':'Sessão salva no diário');});draft=null;releaseWake();state.view='detail';state.detailId=sid;render();window.scrollTo(0,0);
      if(isMember()){clearTimeout(syncTimer);setTimeout(sync,300);}break;}
    case 'detail': state.view='detail'; state.detailId=id; state.confirmDelete=false; render(); window.scrollTo(0,0); break;
    case 'askdel': state.confirmDelete=true; render(); break;
    case 'canceldel': state.confirmDelete=false; render(); break;
    case 'del': {var d0=sessionById(id);if(d0&&d0.bandId)removePhoto(d0.bandId);removeSession(id).then(function(){toast('Sessão apagada');});state.confirmDelete=false;state.view='home';state.tab='historico';render();break;}
    case 'addopen': state.addOpen=true; render(); var f=document.getElementById('nc-name'); if(f)f.focus(); break;
    case 'addclose': state.addOpen=false; render(); break;
    case 'export': exportDownload(); break;
    case 'share': exportShare(); break;
    case 'install': if(installPrompt){installPrompt.prompt();installPrompt.userChoice.then(function(){installPrompt=null;render();}).catch(function(){});} break;
    case 'authmode': cloud.authMode=id; cloud.authMsg=''; render(); break;
    case 'signout': signOut(); break;
    case 'askconfirm': state.confirm=id; render(); break;
    case 'cancelconfirm': state.confirm=''; render(); break;
    case 'deleteaccount': deleteAccount(); break;
    case 'wipe': wipeLocalForAccount(); break;
    case 'syncnow': sync(); break;
    case 'savename': saveName(); break;
    case 'newinvite': createInvite(); break;
    case 'copyinvite': copyText('invite-link',cloud.inviteLink); break;
    case 'shareinvite': navigator.share({title:'Convite para o Clube do Diário de Degustação',text:'Te convidei para o nosso clube de degustação de charutos. Abra no Chrome (Android) ou Safari (iPhone):',url:cloud.inviteLink}).catch(function(){}); break;
    case 'refreshfeed': loadFeed(); break;
    case 'post': state.view='post'; state.postUid=id; render(); window.scrollTo(0,0); fetchFeedPhotos(); break;
    case 'backclube': state.view='home'; state.tab='clube'; render(); break;
    case 'like': toggleLike(id); break;
    case 'comment': addComment(id); break;
    case 'delcomment': deleteComment(id,state.postUid); break;
  }
});
document.addEventListener('input',function(ev){
  var el=ev.target, k=el.getAttribute('data-input'); if(!k||!draft)return;
  if(k==='thirdText')draft.thirds[state.step].text=el.value;
  else if(k==='comment')draft.comment=el.value;
  else if(k==='dur'){var hv=parseInt(document.getElementById('dur-h').value,10)||0,mv=parseInt(document.getElementById('dur-m').value,10)||0;if(hv*60+mv<1)return;setDuration(hv*60+mv);}
  else if(k==='rating'){draft.rating=Number(el.value);var o=document.getElementById('ratingOut');if(o)o.textContent=numStr(draft.rating);}
  scheduleSave();
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='band-camera'||el.id==='band-gallery'){var f=el.files&&el.files[0];el.value='';handleBandFile(f);return;}
  if(el.id==='import-file'){var g=el.files&&el.files[0];el.value='';importFile(g);return;}
  var w=el.getAttribute('data-cmp');if(!w)return;if(w==='A')state.cmpA=el.value;else state.cmpB=el.value;render();
});
document.addEventListener('submit',function(ev){
  var fm=ev.target;
  if(fm.id==='authForm'){ev.preventDefault();submitAuth(fm);return;}
  if(fm.id==='joinForm'){ev.preventDefault();fm.setAttribute('data-mode','join');submitAuth(fm);return;}
  if(fm.id!=='addForm')return; ev.preventDefault();
  var name=document.getElementById('nc-name').value.trim(); if(!name){toast('Informe o nome do charuto.');return;}
  var c={id:uid(),name:name,origin:document.getElementById('nc-origin').value.trim(),vitola:document.getElementById('nc-vitola').value.trim(),strength:Number(document.getElementById('nc-strength').value),status:document.getElementById('nc-status').value,order:100+state.cigars.length};
  put('cigars',c); state.addOpen=false; render(); toast('Charuto adicionado ao acervo');
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush();else{if(state.view==='session'&&draft)requestWake();if(isMember())scheduleSync();}});
window.addEventListener('online',function(){if(isMember()){sync();if(state.tab==='clube')loadFeed();}});
window.addEventListener('offline',function(){if(isMember())setStatus('offline');});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installPrompt=e;if(state.view==='home'&&state.tab==='conta')render();});
window.addEventListener('appinstalled',function(){installPrompt=null;toast('App instalado na tela inicial');});

function init(){
  render();
  openDB().then(function(d){idb=d;return loadAll();}).catch(function(){state.dbError=true;state.loaded=true;}).then(function(){render();cloudInit();});
  try{if(navigator.storage&&navigator.storage.persisted){navigator.storage.persisted().then(function(p){busy.persisted=p;if(!p&&navigator.storage.persist)return navigator.storage.persist().then(function(v){busy.persisted=v;});}).then(function(){if(state.tab==='conta'&&state.view==='home')render();}).catch(function(){});}}catch(e){}
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
}
window.__diario={state:state,cloud:cloud,sync:sync,loadFeed:loadFeed};
init();
})();
</script>
</body>
</html>
